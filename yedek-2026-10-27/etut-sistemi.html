                <span style={{color:"#94a3b8"}}>–</span>
                <input data-genel-aralik-max type="number" min="0" max="100" value={t.max} onChange={e=>setGenelTaslak({...t, max:e.target.value})}

                <span data-genel-aralik-etiket style={{fontWeight:800,fontSize:13,color:"#818cf8",whiteSpace:"nowrap"}}>{genelAralikMetni(genelAralik)}</span>
              </>);
            })()}

            <div key={id} data-tab={id} className="tab" onClick={()=>setActiveTab(id)} style={{
              padding:"8px 14px",borderRadius:"8px 8px 0 0",fontSize:13,fontWeight:600,whiteSpace:"nowrap",flexShrink:0,

              <button type="button" className="btn" onClick={mergeAllByDers} style={{padding:"6px 14px",borderRadius:8,border:"1px solid rgba(129,140,248,0.45)",background:"rgba(129,140,248,0.15)",color:"#c7d2fe",fontWeight:600,fontSize:12}}>📚 Ders birleştir</button>

        {/* ── TAB: YÜKLE ── */}
        {activeTab==="yukle"&&(
          <div style={{padding:"24px 0"}}>
            {/* @@HAFTA-ETIKET — Hafta seçimi (1809-hafta-ux).

        {activeTab==="program"&&(()=>{

            dengeliAta([...programOturumlar, yeni]);
          };
          const removeOturum = (oId) => dengeliAta(programOturumlar.filter(o=>o.id!==oId));
          const updateOturum = (oId, field, val) => {
            const liste = programOturumlar.map(o => o.id===oId ? {...o, [field]:val} : o);
            const i = liste.findIndex(o=>o.id===oId);

              const g = groups.find(x=>x.key===val);
              liste[i] = {...liste[i], ders:g?.ders||'', konu:g?.konu||'', ogrenciler:[], elle:[]};
              dengeliAta(liste); return;
            } else if (field==='kapasite') {
              // @@KAPASITE: en az 1, üst sınır yok; artınca uygun adaylar (aralıkta, müsait, o gün başka etüdü yok) anında dolar
              const k = Math.max(1, Math.round(+val)||1);
              liste[i] = {...liste[i], kapasite:k};
              dengeliAta(liste); return;
            }
            // saat değişince öğrenci listesi korunur; kuralı bozan öğrenci ⚠️ ile işaretlenir, ihlal paneli açılır.
            setProgramOturumlar(liste);

          const toggleOgrenci = (oId, ad) => {
            const o = programOturumlar.find(x=>x.id===oId);
            if (!o) return;

              setProgramOturumlar(prev => prev.map(x => x.id===oId ? {...x, ogrenciler:x.ogrenciler.filter(a=>a!==ad), elle:(x.elle||[]).filter(a=>a!==ad)} : x));

            setProgramOturumlar(prev => prev.map(x => x.id===oId && !x.ogrenciler.includes(ad) ? {...x, kapasite:Math.max(x.kapasite, x.ogrenciler.length+1), ogrenciler:[...x.ogrenciler, ad], elle:[...(x.elle||[]).filter(a=>a!==ad), ad]} : x));

          const kapasiteOk = (oId, yon) => {
            const o = programOturumlar.find(x=>x.id===oId); if (!o) return;
            const gunAdi = gunAdiOf(oId);
            let mesaj = '';
            let yeni;
            if (yon > 0) {
              {
                const grp = groups.find(g=>g.key===o.grupKey);
                // 2710-kapsinir: önce aralıktaki uygun adaylar (en düşük %), bitince "sıra" (esikUstu, Dengeli Ata sırası)
                const uygun = c => !o.ogrenciler.includes(c.ad) && programMusaitMi(ogrMusait, c.ad, gunAdi)
                    && !programOturumlar.some(x => x.id!==oId && x.gunId===o.gunId && x.ogrenciler.includes(c.ad))
                    && !programOturumlar.some(x => x.id!==oId && x.grupKey===o.grupKey && x.ogrenciler.includes(c.ad))
                    && !programCakisiyor(programGunler, programOturumlar, oId, c.ad);
                const aday = [...(grp?.ogrenciler||[])].filter(uygun).sort((a,b)=>Number(a.yuzde)-Number(b.yuzde))[0]
                  || (grp?.esikUstu||[]).find(uygun);
                const ogr = (aday && o.ogrenciler.length < o.kapasite+1) ? [...o.ogrenciler, aday.ad] : o.ogrenciler;
                if (!aday) mesaj = 'Aralıkta uygun öğrenci kalmadı'; // sıra listesi de bittiyse
                yeni = {...o, kapasite:o.kapasite+1, ogrenciler:ogr};
              }
            } else {
              if (o.kapasite <= 1) return;
              const k = o.kapasite-1; let ogr = [...o.ogrenciler];
              const elle = new Set(o.elle||[]);
              while (ogr.length > k) {
                const i = ogr.map((a,j)=>[a,j]).reverse().find(([a])=>!elle.has(a));
                if (!i) { mesaj = 'Elle eklenenler korunuyor — kapasite aşıldı'; break; }
                ogr.splice(i[1],1);
              }
              yeni = {...o, kapasite:k, ogrenciler:ogr};
            }
            setProgramOturumlar(prev => prev.map(x => x.id===oId ? yeni : x));
            setKapasiteUyari(p=>({...p, [oId]:mesaj}));
            if (mesaj) setTimeout(()=>setKapasiteUyari(p=>p[oId]===mesaj?{...p,[oId]:''}:p), 3500);
          };
          const elleUyarilar = (oId, ad) => {
            const o = programOturumlar.find(x=>x.id===oId); if (!o || !ad) return [];
            const u = [];
            if (o.ogrenciler.includes(ad)) u.push('Zaten bu oturumda');
            if (o.ogrenciler.length >= o.kapasite) u.push(`Kapasite dolu (${o.ogrenciler.length}/${o.kapasite}) — eklenir, kapasite ${o.ogrenciler.length+1} olur`);
            if (!programMusaitMi(ogrMusait, ad, gunAdiOf(oId))) u.push(`${gunAdiOf(oId)} müsait değil`);
            if (programCakisiyor(programGunler, programOturumlar, oId, ad)) u.push('Aynı gün/saatte başka etüdü var');
            return u;
          };
          const sekil = programTakvimSekli(programGunler, programOturumlar);
          const ihlaller = takvimIhlalleri(sekil.groups, sekil.takvim);
          const denge = programDengeRaporu(groups, programGunler, programOturumlar, ogrMusait);
          const musaitIhlaller = denge.flatMap(r => r.musaitIhlal);
          const kapasiteDisiGruplar = denge.filter(r => r.kapasiteDisi > 0);
          // @@ARALIK-MODU: haftalık özetin "eşik altı" sayımları yalnız Eşik altı modundaki gruplardan; aralık grupları ayrı satırda.
          const ozet = programHaftaOzeti(studs.map(s => s.ogrenci), groups.filter(g => !g.aralik), programGunler, programOturumlar);
          const aralikOf = (key) => groups.find(g => g.key === key)?.aralik;
          const aralikGruplari = groups.filter(g => g.aralik);
          const oturumAdi = (id) => { const o = programOturumlar.find(x=>x.id===id); return o ? `${o.ders} - ${o.konu}` : id; };
          const btn = (renk) => ({padding:'6px 14px', borderRadius:8, background:`rgba(${renk},0.12)`, border:`1px solid rgba(${renk},0.3)`, fontWeight:700, fontSize:12});
          return (
            <div style={{padding:'20px 0'}}>
              {/* @@PROGRAM-KAYIT: kayıt şeridi + dosya işlemleri */}
              {kayitBulundu && kayitBulundu.anahtar === programAnahtar && (
                <div data-kayit-bulundu style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', padding:'8px 12px', marginBottom:10, borderRadius:8, background:'rgba(245,158,11,0.12)', border:'1px solid rgba(245,158,11,0.45)'}}>
                  <span style={{fontSize:12, fontWeight:800, color:'#fbbf24'}}>💾 Bu karne/hafta için kayıtlı program bulundu</span>
                  <span style={{fontSize:11, color:'#94a3b8'}}>({kayitBulundu.veri.programGunler.length} gün, {kayitBulundu.veri.programOturumlar.length} oturum{kayitBulundu.kaydedildi ? ', ' + new Date(kayitBulundu.kaydedildi).toLocaleString('tr-TR') : ''})</span>
                  <button className="btn" data-kayit-yukle onClick={()=>{ const d = kayitBulundu.veri; setKayitUyari(programKayitUyarisi(d, groups)); programKayitYukle(d, '📥 Kayıtlı program yüklendi'); }}
                    style={{padding:'4px 12px', borderRadius:6, background:'#f59e0b', border:'none', color:'#1e1b4b', fontSize:11, fontWeight:800}}>Yükle</button>
                  <button className="btn" data-kayit-yoksay onClick={()=>setKayitBulundu(null)} title="Kayıt silinmez; programda değişiklik yaparsanız onun yerine yeni program kaydedilir"
                    style={{padding:'4px 12px', borderRadius:6, background:'transparent', border:'1px solid rgba(255,255,255,0.2)', color:'#94a3b8', fontSize:11}}>Yok say</button>
                </div>
              )}
              {kayitUyari && <div data-kayit-uyari style={{fontSize:11, color:'#fca5a5', padding:'6px 10px', marginBottom:8, borderRadius:7, background:'rgba(239,68,68,0.08)', border:'1px solid rgba(239,68,68,0.3)'}}>⚠️ {kayitUyari} <span style={{cursor:'pointer', marginLeft:6, color:'#94a3b8'}} onClick={()=>setKayitUyari('')}>✕</span></div>}
              <div data-kayit-arac style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', marginBottom:10}}>
                <button className="btn" data-kayit-dosya-kaydet onClick={()=>{
                    try {
                      const blob = new Blob([JSON.stringify(programKayitPaket(weekLabel, programAnahtar, programGunler, programOturumlar), null, 1)], {type:'application/json'});
                      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `etut-programi-${(weekLabel||'hafta').replace(/[^\wçğıöşüÇĞİÖŞÜ-]+/g,'_')}.json`;
                      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                      setKayitDurum('💾 Dosyaya kaydedildi');
                    } catch (e) { alert('Dosya oluşturulamadı: ' + (e && e.message)); }
                  }} style={{...btn('16,185,129'), color:'#34d399'}}>💾 Programı dosyaya kaydet</button>
                <button className="btn" data-kayit-dosya-ac onClick={()=>kayitDosyaRef.current && kayitDosyaRef.current.click()} style={{...btn('99,102,241'), color:'#818cf8'}}>📂 Dosyadan aç</button>

                    const f = e.target.files && e.target.files[0]; e.target.value = '';
                    if (!f) return;
                    const r = new FileReader();
                    r.onload = () => {
                      let d;
                      try { d = programKayitDogrula(JSON.parse(String(r.result))); } catch (err) { d = 'Dosya okunamadı: geçerli bir JSON değil.'; }
                      if (typeof d === 'string') { setKayitDurum('⚠️ Açılamadı'); alert('Program dosyası açılamadı: ' + d + '\nMevcut program değiştirilmedi.'); return; }
                      if ((programOturumlar.length || programGunler.length) && !window.confirm('Mevcut programın yerine dosyadaki program konacak. Devam edilsin mi?')) return;
                      setKayitUyari(programKayitUyarisi(d, groups));
                      programKayitYukle(d, '📂 Dosyadan açıldı');
                    };
                    r.onerror = () => alert('Dosya okunamadı. Mevcut program değiştirilmedi.');
                    r.readAsText(f);

                    if (!window.confirm('Bu karne/hafta için kayıtlı program silinecek ve ekrandaki program sıfırlanacak. Emin misiniz?')) return;
                    try { if (programAnahtar) window.localStorage.removeItem(programAnahtar); } catch (e) {}
                    setKayitBulundu(null); setKayitUyari('');
                    setProgramOturumlar([]); setProgramGunler([]);
                    setKayitDurum('🗑️ Kayıtlı program silindi');

              </div>
              <div style={{fontSize:11, color:'#94a3b8', marginBottom:12}}>📏 Kural: Pzt–Cuma öğrenci başına günde en fazla 1 etüt · Cmt–Paz birden fazla olabilir · Aynı gün ve saatte iki etüt asla</div>
              <div style={{fontSize:11, color:'#64748b', marginBottom:12, marginTop:-8}}>ℹ️ Program, Takvim sekmesindeki plandan ayrıdır ve sayfa yenilenince silinir — kapatmadan önce Excel veya PDF alın.</div>
              <div data-program-musait-aciklama style={{fontSize:11, color:'#64748b', marginBottom:12, marginTop:-8}}>🙋 Öğrenci müsaitliği Öğrenciler sekmesinde (7 gün çipi, varsayılan hepsi müsait, kayıtlı kalır): öğrenci gelemediği güne otomatik ya da elle yazılmaz.</div>
              <div data-program-sira-aciklama style={{fontSize:11, color:'#64748b', marginBottom:12, marginTop:-8}}>🔢 Doldurma bütün hafta birlikte: önce eşik altı (en zayıf önce, bir öğrencinin en zayıf dersi önce), aynı grubun oturumlarına dengeli dağılır; boş yer kalırsa aynı etüt grubundan eşik üstü öğrenciler düşük % önce gelir ve <span style={{fontSize:9, fontWeight:800, padding:'1px 6px', borderRadius:10, background:PROGRAM_SIRA_RENK, color:PROGRAM_SIRA_METIN}}>sıra</span> sarı rozetle işaretlenir. Tam sıra aşağıdaki Sıralama Listesi'nde.</div>
              {(ihlaller.saatCakismalari.length>0 || ihlaller.haftaIciAsimlari.length>0) && (
                <div data-program-ihlal style={{background:'rgba(239,68,68,0.08)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:10, padding:'10px 14px', marginBottom:12}}>

                  ))}
                  {ihlaller.haftaIciAsimlari.map((c,i)=>(

                  ))}

              {musaitIhlaller.length>0 && (

                            const yuzdeOf = (ad) => grp?.ogrenciler.find(o=>o.ad===ad) || grp?.esikUstu?.find(o=>o.ad===ad);
                            const eklenebilir = (grp?.ogrenciler||[]).filter(o =>
                              !oturum.ogrenciler.includes(o.ad) && programMusaitMi(ogrMusait, o.ad, gun.gunAdi) && !programCakisiyor(programGunler, programOturumlar, oturum.id, o.ad));
                            const eklenebilirSira = programSiraAdaylari(grp, programGunler, programOturumlar, oturum.id, ogrMusait);
                            const siraSayisi = oturum.ogrenciler.filter(ad=>programKaynak(grp,ad)==='sirala').length;
                            return (
                              <div key={oturum.id} data-program-oturum={oturum.id}
                                style={{background:color+'12', border:`1px solid ${color}30`, borderRadius:10, padding:'10px 11px'}}>
                                {/* Ders/grup seç */}
                                <div style={{display:'flex', alignItems:'center', gap:5, marginBottom:6}}>
                                  <span style={{fontSize:13}}>{emoji}</span>
                                  <select data-program-grup value={oturum.grupKey} onChange={e=>updateOturum(oturum.id,'grupKey',e.target.value)}
                                    style={{flex:1, minWidth:0, background:'transparent', border:'none', color, fontWeight:800, fontSize:10, cursor:'pointer'}}>
                                    {!grp && <option value={oturum.grupKey} style={{background:'#1e293b'}}>{oturum.ders} - {oturum.konu} (bu haftada grup yok)</option>}
                                    {groups.map(g=><option key={g.key} value={g.key} style={{background:'#1e293b'}}>{getMeta(g.ders).emoji} {g.ders} - {g.konu}{g.aralik?` · ${aralikEtiketi(g.aralik)}`:''}</option>)}
                                  </select>
                                  {grp?.aralik && <span data-program-aralik={oturum.id} title="Aralık modu: yalnız bu aralıktaki öğrenciler, aralık dışından doldurma yok" style={{fontSize:9, fontWeight:800, padding:'1px 6px', borderRadius:8, background:'rgba(16,185,129,0.18)', color:'#34d399', whiteSpace:'nowrap'}}>{aralikEtiketi(grp.aralik)}</span>}
                                  <button className="btn" title="İşlenecek konular" onClick={()=>updateOturum(oturum.id,'konuAcik',!oturum.konuAcik)}
                                    style={{padding:'1px 5px', borderRadius:5, background:'rgba(99,102,241,0.1)', border:'none', color:'#818cf8', fontSize:10}}>{oturum.konuAcik?'▲':'▼'}</button>
                                  <button className="btn" data-program-hazirlik-ac={oturum.id} title="Hazırlık kartı: öğrencilerin zayıf konuları (salt okunur)"
                                    onClick={()=>setProgramHazirlikAcik(p=>({...p, [oturum.id]:!p[oturum.id]}))}
                                    style={{padding:'1px 6px', borderRadius:5, background:programHazirlikAcik[oturum.id]?'rgba(20,184,166,0.25)':'rgba(20,184,166,0.1)', border:'none', color:'#2dd4bf', fontSize:10, fontWeight:700}}>📋 Hazırlık</button>
                                  <button className="btn" title="Etüdü sil" onClick={()=>removeOturum(oturum.id)}
                                    style={{padding:'1px 6px', borderRadius:5, background:'rgba(239,68,68,0.1)', border:'none', color:'#f87171', fontSize:10}}>✕</button>
                                </div>
                                {oturum.konuAcik && grp && (
                                  <div style={{background:'rgba(0,0,0,0.2)', borderRadius:7, padding:'7px 9px', marginBottom:6}}>
                                    <div style={{fontSize:9, color:'#64748b', fontWeight:700, marginBottom:4}}>📚 İşlenecek konular:</div>
                                    <div style={{display:'flex', flexWrap:'wrap', gap:3}}>
                                      {(grp.altKonular||[grp.konu]).filter(Boolean).map((k,i)=>(
                                        <span key={i} style={{padding:'2px 7px', borderRadius:5, fontSize:9, fontWeight:600, background:color+'18', color, border:`1px solid ${color}30`}}>{k}</span>
                                      ))}
                                    </div>
                                    <div style={{fontSize:9, color:'#475569', marginTop:5}}>{grp.aralik ? `${grp.ogrenciler.length} öğrenci bu grupta ${aralikEtiketi(grp.aralik)} içinde (aralık dışından doldurma yok)` : <>{grp.ogrenciler.length} öğrenci bu grupta eşik altında{(grp.esikUstu||[]).length>0 && ` · ${grp.esikUstu.length} eşik üstü (sıra)`}</>}</div>
                                  </div>
                                )}
                                {/* Hazırlık kartı (1609-hazirlik): salt okunur — öğrenci × zayıf konu/kazanım + oturum geneli sık zayıflar */}
                                {programHazirlikAcik[oturum.id] && (()=>{
                                  const hz = programHazirlik(oturum, aralikHazirlikGrubu(grp), studs, konuGruplari, aralikHazirlikEsik(grp, threshold));
                                  const altEtiket = (a) => a.tur==='alt' ? 'alt başlık' : 'kazanım';
                                  return (
                                    <div data-program-hazirlik={oturum.id} data-hazirlik-ogrenci-sayisi={hz.ogrenciler.length} data-hazirlik-ortak-sayisi={hz.ortakKonular.length}
                                      style={{background:'rgba(0,0,0,0.25)', border:'1px solid rgba(20,184,166,0.3)', borderRadius:8, padding:'8px 10px', marginBottom:6}}>
                                      <div style={{fontSize:10, fontWeight:800, color:'#2dd4bf', marginBottom:2}}>📋 Hazırlık — {gun.gunAdi}{gun.tarih?` ${gun.tarih}`:''} {oturum.saat} · {oturum.ders} - {oturum.konu}{grp?.aralik ? ` · ${aralikEtiketi(grp.aralik)}` : ''}</div>
                                      {grp?.aralik
                                        ? <div data-hazirlik-aralik={oturum.id} style={{fontSize:9, color:'#64748b', marginBottom:6}}>{aralikEtiketi(grp.aralik)} grubu: zayıf = üst sınır %{grp.aralik.max} ve altı (doğru/soru). Salt okunur; programı değiştirmez.</div>
                                        : <div style={{fontSize:9, color:'#64748b', marginBottom:6}}>Zayıf = genel aralık {genelAralikMetni(genelAralik)} içinde (doğru/soru). Salt okunur; programı değiştirmez.</div>}
                                      {hz.ogrenciler.length===0 ? (
                                        <div style={{fontSize:9, color:'#475569', fontStyle:'italic'}}>Bu oturumda öğrenci yok.</div>
                                      ) : (<>
                                        <div data-hazirlik-ortak style={{marginBottom:7}}>
                                          <div style={{fontSize:9, fontWeight:700, color:'#94a3b8', marginBottom:3}}>Sık görülen zayıf konular:</div>
                                          {hz.ortakKonular.length===0 && <div style={{fontSize:9, color:'#475569', fontStyle:'italic'}}>Eşik altı konu yok.</div>}
                                          <div style={{display:'flex', flexWrap:'wrap', gap:3}}>
                                            {hz.ortakKonular.map(k=>(
                                              <span key={k.konu} data-hazirlik-ortak-konu={k.konu} data-hazirlik-sayi={k.sayi} title={k.ogrenciler.join(', ')}
                                                style={{padding:'2px 7px', borderRadius:5, fontSize:9, fontWeight:700, background:color+'22', color, border:`1px solid ${color}40`}}>
                                                {k.konu} · {k.sayi}/{hz.ogrenciler.length} öğr · ort %{k.ort}
                                              </span>
                                            ))}
                                          </div>
                                          {hz.ortakAlt.length>0 && (
                                            <details style={{marginTop:4}}>
                                              <summary style={{fontSize:9, color:'#64748b', cursor:'pointer', userSelect:'none'}}>Zayıf alt başlık / kazanım ({hz.ortakAlt.length})</summary>
                                              {hz.ortakAlt.map(a=>(
                                                <div key={a.konu+a.tur+a.ad} data-hazirlik-ortak-alt={a.ad} data-hazirlik-sayi={a.sayi} title={a.ogrenciler.join(', ')} style={{fontSize:9, color:'#cbd5e1', paddingLeft:8}}>
                                                  • {a.ad} <span style={{color:'#64748b'}}>({altEtiket(a)} · {a.konu})</span> — {a.sayi} öğr
                                                </div>
                                              ))}
                                            </details>
                                          )}
                                        </div>
                                        <div style={{display:'flex', flexDirection:'column', gap:4}}>
                                          {hz.ogrenciler.map(o=>(
                                            <div key={o.ad} data-hazirlik-ogrenci={o.ad} data-hazirlik-kaynak={o.kaynak||''} style={{borderTop:'1px solid rgba(255,255,255,0.06)', paddingTop:4}}>
                                              <div style={{fontSize:10, fontWeight:700, color:'#e2e8f0'}}>
                                                {o.kaynak==='sirala' && <span style={{fontSize:8, fontWeight:800, padding:'0 4px', marginRight:3, borderRadius:6, background:PROGRAM_SIRA_RENK, color:PROGRAM_SIRA_METIN}}>sıra</span>}
                                                {o.ad}{o.grupYuzde!==null && <span style={{color:o.grupYuzde<threshold?'#f87171':'#94a3b8', marginLeft:4}}>%{o.grupYuzde}{o.detay&&o.detay.length?` (${birlesikOrtEtiketi(o)})`:''}</span>}
                                              </div>
                                              {o.veriYok && <div style={{fontSize:9, color:'#475569', fontStyle:'italic', paddingLeft:8}}>Bu grubun konularında karne satırı yok.</div>}
                                              {!o.veriYok && o.konular.length===0 && <div style={{fontSize:9, color:'#475569', fontStyle:'italic', paddingLeft:8}}>Eşik altı konu/kazanım yok.</div>}
                                              {o.konular.map(k=>(
                                                <div key={k.konu} data-hazirlik-konu={k.konu} data-hazirlik-zayif={k.zayif?'1':'0'} style={{paddingLeft:8}}>
                                                  <div style={{fontSize:9, color:k.zayif?'#fca5a5':'#94a3b8'}}>{k.zayif?'▸':'·'} {k.konu} %{k.yuzde}{k.soru?` (${k.soru} soru)`:''}</div>
                                                  {k.alt.map(a=>(
                                                    <div key={a.tur+a.ust+a.ad} data-hazirlik-kazanim={a.ad} data-hazirlik-tur={a.tur} style={{fontSize:9, color:'#94a3b8', paddingLeft:10}}>– {a.ad} %{a.yuzde} <span style={{color:'#475569'}}>({altEtiket(a)})</span></div>
                                                  ))}
                                                </div>
                                              ))}
                                            </div>
                                          ))}
                                        </div>
                                      </>)}
                                    </div>
                                  );
                                })()}
                                {/* Saat + hoca adı */}
                                <div style={{display:'flex', gap:6, marginBottom:6}}>
                                  <select data-program-saat value={oturum.saat} onChange={e=>updateOturum(oturum.id,'saat',e.target.value)}
                                    style={{padding:'4px 6px', borderRadius:6, border:'1px solid rgba(255,255,255,0.1)', background:'rgba(255,255,255,0.05)', color:'#e2e8f0', fontSize:11}}>
                                    {SAATLER.map(s=><option key={s} value={s} style={{background:'#1e293b'}}>{s}</option>)}
                                  </select>
                                  <input data-program-hoca type="text" placeholder="Hoca adı..." value={oturum.hoca} onChange={e=>updateOturum(oturum.id,'hoca',e.target.value)}
                                    style={{flex:1, minWidth:0, padding:'4px 8px', borderRadius:6, border:'1px solid rgba(255,255,255,0.1)', background:'rgba(255,255,255,0.05)', color:'#e2e8f0', fontSize:11}}/>
                                </div>
                                {/* Kapasite */}
                                <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:7}}>
                                  <span style={{fontSize:10, color:'#64748b'}}>Kapasite:</span>
                                  <button className="btn" data-kapasite-azalt={oturum.id} disabled={oturum.kapasite<=1} onClick={()=>kapasiteOk(oturum.id,-1)} title="Kapasiteyi 1 azalt (son otomatik eklenen çıkar)" style={{padding:'1px 8px', borderRadius:5, border:'1px solid rgba(255,255,255,0.15)', background:'rgba(255,255,255,0.06)', color:'#e2e8f0', fontWeight:900, cursor:'pointer', opacity:oturum.kapasite<=1?0.4:1}}>▼</button>
                                  <input type="number" data-kapasite-input={oturum.id} min="1" value={oturum.kapasite} onChange={e=>{ const v=e.target.value; if (v==='' || !(+v>=1)) return; updateOturum(oturum.id,'kapasite',+v); }}
                                    style={{width:44, padding:'2px 5px', borderRadius:5, border:'1px solid rgba(255,255,255,0.1)', background:'rgba(255,255,255,0.06)', color:'#e2e8f0', fontSize:11, textAlign:'center'}}/>
                                  <button className="btn" data-kapasite-artir={oturum.id} onClick={()=>kapasiteOk(oturum.id,1)} title="Kapasiteyi 1 artır ve en uygun öğrenciyi ekle" style={{padding:'1px 8px', borderRadius:5, border:'1px solid rgba(255,255,255,0.15)', background:'rgba(255,255,255,0.06)', color:'#e2e8f0', fontWeight:900, cursor:'pointer', opacity:1}}>▲</button>
                                  {kapasiteUyari[oturum.id] && <span data-kapasite-uyari={oturum.id} style={{fontSize:10, color:'#fbbf24', fontWeight:700}}>⚠️ {kapasiteUyari[oturum.id]}</span>}
                                  <span data-kapasite-durum={oturum.id} style={{fontSize:10, color:doluMu?'#f87171':'#34d399', fontWeight:700}}>{oturum.ogrenciler.length}/{oturum.kapasite} öğrenci</span>
                                  {siraSayisi>0 && <span data-program-sira-sayisi={siraSayisi} style={{fontSize:10, color:'#94a3b8'}}>· {oturum.ogrenciler.length-siraSayisi} aralıkta + {siraSayisi} sıra</span>}
                                </div>
                                {/* Kayıtlı öğrenciler (tıkla çıkar) */}
                                <div style={{display:'flex', flexWrap:'wrap', gap:3}}>
                                  {oturum.ogrenciler.length===0 && <span style={{fontSize:9, color:'#475569', fontStyle:'italic'}}>Henüz öğrenci eklenmedi</span>}
                                  {oturum.ogrenciler.map(ad=>{
                                    const o = yuzdeOf(ad);
                                    const musaitDegil = !programMusaitMi(ogrMusait, ad, gun.gunAdi);
                                    const ihlal = musaitDegil || programCakisiyor(programGunler, programOturumlar, oturum.id, ad);
                                    const elleMi = (oturum.elle||[]).includes(ad);
                                    const gerekce = elleMi ? 'Elle eklendi' : grupGerekce(grp, ad, threshold);
                                    const kaynak = elleMi ? 'elle' : programKaynak(grp, ad);
                                    const sira = kaynak==='sirala';
                                    return (
                                      <span key={ad} data-program-ogrenci={ad} data-program-kaynak={kaynak||''} data-program-gerekce={gerekce} data-program-musait-degil={musaitDegil?'1':undefined} data-program-elle={elleMi?'1':undefined} onClick={()=>toggleOgrenci(oturum.id,ad)}
                                        title={(musaitDegil?`🚫 ${gun.gunAdi} müsait değil — `:ihlal?'⚠️ Kural: bu gün/saatte başka etüdü var — ':'')+(gerekce?gerekce+' — ':'')+'Çıkarmak için tıkla'}
                                        style={{padding:'2px 8px', borderRadius:12, fontSize:9, fontWeight:700, cursor:'pointer', background:sira?PROGRAM_SIRA_RENK:color+'35', color:sira?PROGRAM_SIRA_METIN:color, border:sira?`1px solid ${PROGRAM_SIRA_RENK}`:`1px solid ${color}60`, outline:ihlal?'2px solid #ef4444':undefined}}>
                                        {musaitDegil?'🚫 ':ihlal&&'⚠️ '}{elleMi&&<span data-elle-rozet style={{fontSize:8, fontWeight:800, padding:'0 4px', marginRight:3, borderRadius:6, background:'#f59e0b', color:'#1e1b4b'}}>elle eklendi</span>}{sira&&<span style={{fontSize:8, fontWeight:800, padding:'0 4px', marginRight:3, borderRadius:6, background:PROGRAM_SIRA_METIN, color:PROGRAM_SIRA_RENK}}>sıra</span>}{ad}{o&&<span style={{opacity:0.6, marginLeft:2}}>%{o.yuzde}</span>}
                                        <span data-program-cikar={ad} title="Oturumdan çıkar" onClick={e=>{e.stopPropagation();toggleOgrenci(oturum.id,ad);}} style={{marginLeft:4, fontWeight:900, opacity:0.75, cursor:'pointer'}}>×</span>
                                      </span>
                                    );
                                  })}
                                </div>
                                {/* Eklenebilir öğrenciler (kuralı bozacaklar listelenmez) */}
                                {!doluMu && (eklenebilir.length>0 || eklenebilirSira.length>0) && (
                                  <details style={{marginTop:4}}>
                                    <summary style={{fontSize:9, color:'#64748b', cursor:'pointer', userSelect:'none'}}>+ {eklenebilir.length} öğrenci eklenebilir ({oturum.kapasite-oturum.ogrenciler.length} boş){eklenebilirSira.length>0 && ` · ${eklenebilirSira.length} sıra adayı`}</summary>
                                    {eklenebilir.length>0 && (
                                      <div style={{display:'flex', flexWrap:'wrap', gap:3, marginTop:4, padding:6, borderRadius:7, border:'1px dashed rgba(255,255,255,0.07)'}}>
                                        {eklenebilir.map(o=>(
                                          <span key={o.ad} onClick={()=>toggleOgrenci(oturum.id,o.ad)} title="Eklemek için tıkla"
                                            style={{padding:'2px 7px', borderRadius:12, fontSize:9, cursor:'pointer', background:'rgba(255,255,255,0.05)', color:'#94a3b8', border:'1px solid rgba(255,255,255,0.09)'}}>
                                            {o.ad}<span style={{opacity:0.5, marginLeft:2}}>%{o.yuzde}</span>
                                          </span>
                                        ))}
                                      </div>
                                    )}
                                    {eklenebilirSira.length>0 && (
                                      <div data-program-eklenebilir-sira style={{marginTop:4, padding:6, borderRadius:7, border:`1px dashed ${PROGRAM_SIRA_RENK}55`}}>
                                        <div style={{fontSize:9, color:PROGRAM_SIRA_RENK, marginBottom:3}}>Sıra — aralık üstü, düşük % önce:</div>
                                        <div style={{display:'flex', flexWrap:'wrap', gap:3}}>
                                          {eklenebilirSira.map(o=>(
                                            <span key={o.ad} data-program-sira-aday={o.ad} onClick={()=>toggleOgrenci(oturum.id,o.ad)} title="Sıra (aralık üstü) — eklemek için tıkla"
                                              style={{padding:'2px 7px', borderRadius:12, fontSize:9, cursor:'pointer', background:PROGRAM_SIRA_RENK+'1f', color:PROGRAM_SIRA_RENK, border:`1px dashed ${PROGRAM_SIRA_RENK}80`}}>
                                              {o.ad}<span style={{opacity:0.5, marginLeft:2}}>%{o.yuzde}</span>
                                            </span>
                                          ))}
                                        </div>
                                      </div>
                                    )}
                                  </details>
                                )}
                                {(()=>{
                                  // @@ELLE-EKLE: aramalı kutu — karnedeki TÜM öğrenciler; serbest isim de eklenebilir
                                  const yazi = elleArama[oturum.id] || '';
                                  const q = elleAramaAnahtari(yazi);
                                  const tumAdlar = [...new Set(studs.map(s=>s.ogrenci).filter(Boolean))];
                                  const oneri = q ? tumAdlar.filter(a=>elleAramaAnahtari(a).includes(q) && !oturum.ogrenciler.includes(a)).sort((a,b)=>a.localeCompare(b,'tr')).slice(0,8) : [];
                                  const tamEsles = tumAdlar.find(a=>elleAramaAnahtari(a)===q);
                                  const hedef = tamEsles || yazi.trim();
                                  const uyari = q ? elleUyarilar(oturum.id, hedef) : [];
                                  return (
                                    <div data-elle-ekle={oturum.id} style={{marginTop:6, padding:6, borderRadius:7, border:'1px solid rgba(245,158,11,0.35)', background:'rgba(245,158,11,0.06)'}}>
                                      <div style={{display:'flex', gap:4}}>
                                        <input data-elle-input={oturum.id} value={yazi} placeholder="+ Öğrenci ekle (ad yaz)…" onChange={e=>setElleArama(p=>({...p, [oturum.id]:e.target.value}))}
                                          onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); elleEkle(oturum.id, oneri.length===1 && !tamEsles ? oneri[0] : hedef); } }}
                                          style={{flex:1, minWidth:0, padding:'3px 6px', borderRadius:5, border:'1px solid rgba(255,255,255,0.15)', background:'rgba(255,255,255,0.06)', color:'#e2e8f0', fontSize:10}}/>
                                        <button className="btn" data-elle-ekle-btn={oturum.id} disabled={!yazi.trim()} onClick={()=>elleEkle(oturum.id, hedef)}
                                          style={{padding:'2px 8px', borderRadius:5, background:'#f59e0b', border:'none', color:'#1e1b4b', fontSize:10, fontWeight:800, opacity:yazi.trim()?1:0.4}}>Ekle</button>
                                      </div>
                                      {oneri.length>0 && <div style={{display:'flex', flexWrap:'wrap', gap:3, marginTop:4}}>
                                        {oneri.map(a=>{ const uy = elleUyarilar(oturum.id, a); return (
                                          <span key={a} data-elle-oneri={a} onClick={()=>elleEkle(oturum.id, a)} title={uy.length?('⚠️ '+uy.join(' · ')+' — yine de eklenir'):'Eklemek için tıkla'}
                                            style={{padding:'2px 7px', borderRadius:12, fontSize:9, cursor:'pointer', background:'rgba(255,255,255,0.06)', color:uy.length?'#fbbf24':'#e2e8f0', border:'1px solid rgba(255,255,255,0.12)'}}>{uy.length?'⚠️ ':''}{a}</span>); })}
                                      </div>}
                                      {q && !tamEsles && oneri.length===0 && <div data-elle-serbest style={{fontSize:9, color:'#fbbf24', marginTop:3}}>Karnede yok — "{yazi.trim()}" serbest isim olarak eklenecek</div>}
                                      {uyari.length>0 && <div data-elle-uyari={oturum.id} style={{fontSize:9, color:'#fca5a5', marginTop:3}}>⚠️ {uyari.join(' · ')}</div>}
                                    </div>
                                  );
                                })()}
                                {doluMu && <div style={{fontSize:9, color:'#f87171', marginTop:3}}>🔴 Oturum dolu — ▲ ile artır ya da çıkarmak için öğrencinin üstüne tıkla</div>}
                              </div>
                            );
                          })}
                          <button className="btn" data-program-ekle={gun.id} onClick={()=>addOturum(gun.id)}
                            style={{width:'100%', padding:7, borderRadius:8, border:'1px dashed rgba(99,102,241,0.3)', background:'transparent', color:'#64748b', fontSize:11, fontWeight:600, cursor:'pointer'}}>
                            + Etüt/Ders ekle
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Haftalık özet (1509-p0p1): salt okunur sayım — denemeye giren / etüt yazılan / bu hafta gelmeyecek + öğrenci başına etüt sayısı */}
              {studs.length>0 && (
                <div data-program-ozet data-ozet-deneme={ozet.deneme} data-ozet-yazilan={ozet.yazilan} data-ozet-gelmeyen={ozet.gelmeyen} data-ozet-toplam-etut={ozet.toplamEtut} data-ozet-esik-yazilmadi={ozet.esikAltiYazilmadi}
                  data-ozet-esik-yazilmayan={ozet.esikAltiYazilmayan} data-ozet-talep-acik={ozet.talepAcik}
                  style={{marginTop:22, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:14}}>
                  <div style={{fontFamily:"'Outfit',sans-serif", fontSize:15, fontWeight:800, color:'#f1f5f9', marginBottom:8}}>📊 Haftalık Özet</div>
                  <div style={{display:'flex', gap:10, flexWrap:'wrap', marginBottom:8}}>
                    {[[ozet.deneme,'Denemeye giren','#818cf8'],[ozet.yazilan,'Etüt yazılan','#34d399'],[ozet.gelmeyen,'Bu hafta etüte gelmeyecek','#fbbf24'],[ozet.esikAltiYazilmayan,'Aralıkta ama yazılmayan','#fca5a5'],[ozet.toplamEtut,'Toplam etüt kaydı (öğrenci × oturum)','#fda4af']].map(([v,l,c])=>(
                      <div key={l} style={{background:'rgba(255,255,255,0.04)', borderRadius:10, padding:'8px 14px', minWidth:130}}>
                        <div style={{fontWeight:800, fontSize:20, color:c}}>{v}</div>
                        <div style={{fontSize:10, color:'#94a3b8'}}>{l}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{fontSize:10, color:'#64748b', marginBottom:8}}>
                    Etüt yazılan = programda en az 1 oturumda adı geçen öğrenci · Gelmeyecek = denemeye giren − etüt yazılan (bu hafta hiç oturumu yok)
                  </div>

                  {/* 1509-ozet-esikdisi (kullanıcı 16.09): "gelmeyecek"ten AYRI kutu — eşik altı olup programda hiç oturumu olmayanlar */}
                  {ozet.esikAltiYazilmayan>0 && (
                    <div data-program-esikdisi={ozet.esikAltiYazilmayan}
                      style={{background:'rgba(239,68,68,0.06)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:10, padding:'10px 14px', marginBottom:8}}>
                      <div style={{fontSize:12, fontWeight:800, color:'#fca5a5', marginBottom:3}}>⚠️ Aralıkta ama yazılmayan ({ozet.esikAltiYazilmayan})</div>
                      <div style={{fontSize:10, color:'#94a3b8', marginBottom:6}}>
                        En az bir eşik altı grubunda olup programda hiç oturumu olmayan öğrenci. Sebep ayrılmaz: kapasite dolu, gün/saat veya müsaitlik çakışması ya da o dersin hiç oturumu açılmamış olması.
                      </div>
                      <details data-program-esikdisi-liste>
                        <summary style={{fontSize:11, color:'#fca5a5', cursor:'pointer', userSelect:'none'}}>Kimler? ({ozet.esikAltiYazilmayan} öğrenci · hangi zayıf gruplar)</summary>
                        <div style={{maxHeight:260, overflowY:'auto', marginTop:6, display:'flex', flexDirection:'column', gap:4}}>
                          {[...ozet.esikAltiYazilmayanListe].sort((a,b)=>b.esikAltiGrup-a.esikAltiGrup || a.ad.localeCompare(b.ad,'tr')).map(o=>{
                            const metin = o.zayifGruplar.map(z=>`${z.ders} - ${z.konu} %${z.yuzde}`).join(' · ');
                            return (
                              <div key={o.ad} data-esikdisi-ogrenci={o.ad} data-esikdisi-grup-sayisi={o.esikAltiGrup} title={metin}
                                style={{display:'flex', gap:8, alignItems:'baseline', fontSize:11}}>
                                <span style={{color:'#e2e8f0', fontWeight:700, minWidth:150}}>{o.ad}</span>
                                <span style={{color:'#94a3b8', fontSize:10}}>{metin}</span>
                              </div>
                            );
                          })}
                        </div>
                      </details>
                    </div>
                  )}
                  {ozet.talepAcik>ozet.esikAltiYazilmayan && (
                    <div data-program-talep-acik={ozet.talepAcik} style={{fontSize:10, color:'#fbbf24', marginBottom:8}}>
                      ℹ️ Ayrıca: {ozet.talepAcik} öğrencinin en az bir eşik altı konusu programda karşılanmadı (başka derste oturumu olanlar dahil).
                    </div>
                  )}
                  {/* @@ARALIK-MODU: aralık grupları — eşik sayımlarından ayrı */}
                  {aralikGruplari.length>0 && (
                    <div data-program-ozet-aralik={aralikGruplari.length} style={{background:'rgba(16,185,129,0.06)', border:'1px solid rgba(16,185,129,0.3)', borderRadius:10, padding:'10px 14px', marginBottom:8}}>
                      <div style={{fontSize:12, fontWeight:800, color:'#34d399', marginBottom:4}}>🎯 Aralık grupları ({aralikGruplari.length})</div>
                      {aralikGruplari.map(g=>{
                        const r = denge.find(x=>x.grupKey===g.key);
                        return (
                          <div key={g.key} data-ozet-aralik-grup={g.key} data-ozet-aralik-etiket={aralikEtiketi(g.aralik)} data-ozet-aralik-n={g.ogrenciler.length}
                            data-ozet-aralik-yerlesen={r?r.yerlesen:0} data-ozet-aralik-kapasite={r?r.kapasiteDisi:0} style={{fontSize:11, color:'#cbd5e1', marginBottom:2}}>
                            <b style={{color:getMeta(g.ders).color}}>{g.ders} - {g.konu}</b> · {aralikEtiketi(g.aralik)}: {g.ogrenciler.length} öğrenci aralıkta
                            {r ? <> · <b style={{color:'#34d399'}}>{r.yerlesen} yazıldı</b>{r.kapasiteDisi>0 && <span style={{color:'#fca5a5'}}> · {r.kapasiteDisi} kapasite dışı</span>}{r.cakisma>0 && <span style={{color:'#fca5a5'}}> · {r.cakisma} çakışma</span>}{r.musaitDisi>0 && <span style={{color:'#fca5a5'}}> · {r.musaitDisi} müsait değil</span>}</>
                              : <span style={{color:'#64748b'}}> · programda oturum yok</span>}
                          </div>
                        );
                      })}
                      <div style={{fontSize:10, color:'#64748b', marginTop:3}}>Aralık grupları yukarıdaki "eşik altı" sayımlarına girmez; aralık dışından doldurma yapılmaz.</div>
                    </div>
                  )}
                  <details data-program-ozet-tablo>
                    <summary style={{fontSize:11, color:'#94a3b8', cursor:'pointer', userSelect:'none'}}>Öğrenci başına bu haftaki etüt sayısı ({ozet.deneme} öğrenci)</summary>
                    <div style={{maxHeight:360, overflowY:'auto', marginTop:6}}>
                      <table style={{width:'100%', borderCollapse:'collapse'}}>
                        <thead><tr>{['Öğrenci','Bu hafta etüt','Eşik altı grup','Oturumlar'].map(h=>(
                          <th key={h} style={{padding:'6px 8px', textAlign:'left', fontSize:10, color:'#64748b', fontWeight:700, borderBottom:'1px solid rgba(255,255,255,0.08)', position:'sticky', top:0, background:'#0f172a'}}>{h}</th>
                        ))}</tr></thead>
                        <tbody>
                          {[...ozet.ogrenciler].sort((a,b)=>b.etut-a.etut || a.ad.localeCompare(b.ad,'tr')).map(o=>(
                            <tr key={o.ad} data-ozet-ogrenci={o.ad} data-ozet-etut={o.etut}>
                              <td style={{padding:'4px 8px', fontSize:11, color:o.etut===0&&o.esikAltiGrup>0?'#fca5a5':'#e2e8f0', borderBottom:'1px solid rgba(255,255,255,0.04)'}}>{o.ad}</td>
                              <td style={{padding:'4px 8px', fontSize:11, fontWeight:800, color:o.etut>0?'#34d399':'#64748b', borderBottom:'1px solid rgba(255,255,255,0.04)'}}>{o.etut}</td>
                              <td style={{padding:'4px 8px', fontSize:11, color:'#94a3b8', borderBottom:'1px solid rgba(255,255,255,0.04)'}}>{o.esikAltiGrup}</td>
                              <td style={{padding:'4px 8px', fontSize:10, color:'#94a3b8', borderBottom:'1px solid rgba(255,255,255,0.04)'}}>{o.oturumlar.map(x=>`${x.gunAdi} ${x.saat} ${x.ders} - ${x.konu}`).join(' · ') || '—'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </details>
                </div>
              )}

              {/* Sıralama listesi (kullanıcı 15.09): grubun tüm adayları doldurma sırasıyla — ad + % + eşik altı / sıra + programdaki yeri */}
              {groups.length>0 && (()=>{
                const programGruplari = [...new Set(programOturumlar.map(o=>o.grupKey))].filter(k=>groups.some(g=>g.key===k));
                const seciliKey = groups.some(g=>g.key===programSiraGrup) ? programSiraGrup : (programGruplari[0] || groups[0].key);
                const sg = groups.find(g=>g.key===seciliKey);
                const {color} = getMeta(sg.ders);
                const liste = programSiraListesi(sg, programGunler, programOturumlar);
                const grupOturum = programOturumlar.filter(o=>o.grupKey===sg.key);
                const yerlesen = liste.filter(s=>s.yerler.length>0);
                const yerlesenEsik = yerlesen.filter(s=>s.kaynak==='esik').length;
                const yerlesenSira = yerlesen.length - yerlesenEsik;
                const acikEsik = liste.filter(s=>s.kaynak==='esik' && s.yerler.length===0).length;
                const th = {padding:'6px 8px', textAlign:'left', fontSize:10, color:'#64748b', fontWeight:700, borderBottom:'1px solid rgba(255,255,255,0.08)', position:'sticky', top:0, background:'#0f172a'};
                const td = {padding:'4px 8px', fontSize:11, borderBottom:'1px solid rgba(255,255,255,0.04)'};
                return (
                  <div data-program-sira-listesi style={{marginTop:22, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:14}}>
                    <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:8}}>
                      <div style={{fontFamily:"'Outfit',sans-serif", fontSize:15, fontWeight:800, color:'#f1f5f9'}}>🔢 Sıralama Listesi</div>
                      <select data-program-sira-grup value={seciliKey} onChange={e=>setProgramSiraGrup(e.target.value)}
                        style={{flex:'1 1 260px', maxWidth:460, padding:'4px 8px', borderRadius:7, border:`1px solid ${color}40`, background:'rgba(255,255,255,0.05)', color, fontWeight:700, fontSize:11}}>
                        {groups.map(g=><option key={g.key} value={g.key} style={{background:'#1e293b'}}>{getMeta(g.ders).emoji} {g.ders} - {g.konu}{g.aralik?` · ${aralikEtiketi(g.aralik)}`:''}{programGruplari.includes(g.key)?' · programda':''}</option>)}
                      </select>
                    </div>
                    <div style={{fontSize:11, color:'#94a3b8', marginBottom:8}}>
                      {sg.aralik ? <span data-sira-aralik={aralikEtiketi(sg.aralik)}>{aralikEtiketi(sg.aralik)}: <b style={{color}}>{sg.ogrenciler.length} öğrenci aralıkta</b> · aralık dışından doldurma yok</span>
                        : <>Genel aralık {genelAralikMetni(genelAralik)}: <b style={{color}}>{sg.ogrenciler.length} aralıkta</b> · <b style={{color:PROGRAM_SIRA_RENK}}>{(sg.esikUstu||[]).length} aralık üstü (sıra)</b></>}
                      {' · '}programda {grupOturum.length} oturum, toplam kapasite {grupOturum.reduce((a,o)=>a+o.kapasite,0)} → yerleşen {yerlesenEsik} aralıkta + {yerlesenSira} sıra
                      {acikEsik>0 && grupOturum.length>0 && <span style={{color:'#fca5a5'}}> · {acikEsik} aralıktaki öğrenci henüz yerleşmedi</span>}
                    </div>
                    <div style={{maxHeight:420, overflowY:'auto', borderRadius:8, border:'1px solid rgba(255,255,255,0.06)'}}>
                      <table style={{width:'100%', borderCollapse:'collapse'}}>
                        <thead><tr><th style={th}>#</th><th style={th}>Öğrenci</th><th style={th}>%</th><th style={th}>Tür</th><th style={th}>Programda</th></tr></thead>
                        <tbody>
                          {liste.map(s=>{
                            const sira = s.kaynak==='sirala';
                            const yer = s.yerler.map(y=>`${y.gunAdi}${y.tarih?' '+y.tarih:''} ${y.saat}`).join(', ');
                            return (
                              <tr key={s.ad} data-sira-satir={s.ad} data-sira-kaynak={s.kaynak} data-sira-yuzde={s.yuzde} data-sira-yer={yer}
                                style={{background:sira?PROGRAM_SIRA_RENK+'10':color+'10', boxShadow:`inset 3px 0 0 ${sira?PROGRAM_SIRA_RENK:color}`, opacity:s.yerler.length||!grupOturum.length?1:0.7}}>
                                <td style={{...td, color:'#64748b', width:36}}>{s.sira}</td>
                                <td style={{...td, color:'#e2e8f0', fontWeight:600}} title={s.detay?`${birlesikDetayMetni(s.detay,' + ')} → ${birlesikOrtEtiketi(s)} %${s.yuzde}`:''}>{s.ad}</td>
                                <td style={{...td, color:sira?PROGRAM_SIRA_RENK:color, fontWeight:700, width:48}}>%{s.yuzde}</td>
                                <td style={{...td, width:90}}>
                                  <span style={{padding:'1px 7px', borderRadius:10, fontSize:9, fontWeight:800, background:sira?PROGRAM_SIRA_RENK:color+'35', color:sira?PROGRAM_SIRA_METIN:color}}>{sira?'Sıra':sg.aralik?'Aralık':'Eşik altı'}</span>
                                </td>
                                <td style={{...td, color:yer?'#cbd5e1':'#475569'}}>{yer||'—'}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}
            </div>
          );
        })()}

        {/* ── TAB: TAKVİM ── */}
        {activeTab==="takvim"&&(
          <div style={{padding:"20px 0"}}>
            <div style={{marginBottom:14}}>
              <div style={{fontFamily:"'Outfit',sans-serif",fontWeight:800,fontSize:18,color:"#f1f5f9"}}>🗓️ Etüt Programı</div>
              <div style={{fontSize:12,color:"#64748b",marginTop:2}}>Her etüt grubuna gün ve saat ata ya da otomatik yerleştir. Hücredeki "öğrenciler · %" listesi birleşik etütte konu konu yüzdeleri de gösterir.</div>
            </div>
            {groups.length===0?(
              <div style={{textAlign:"center",padding:"56px 0",color:"#475569"}}><div style={{fontSize:40,marginBottom:8}}>🗓️</div><div>Etüt grubu yok.</div></div>
            ):(()=>{
              // Build weekly grid: gun > saat > [groups] — modül seviyesindeki GUNLER/SAATLER kullanılır (7 gün).
              const grid = {};
              GUNLER.forEach(g=>{grid[g]={};SAATLER.forEach(s=>{grid[g][s]=[];});});
              groups.forEach(g=>{
                const t=takvim[g.key];
                if(t&&t.gun&&t.saat&&GUNLER.includes(t.gun)&&SAATLER.includes(t.saat)) grid[t.gun][t.saat].push(g);
              });
              const unscheduled = groups.filter(g=>!takvim[g.key]?.gun || !takvim[g.key]?.saat);
              // Kural ihlalleri: mevcut takvime göre saat çakışmaları ve hafta içi aşımları.
              const ihlaller = takvimIhlalleri(groups, takvim);
              // Bir kutunun ihlale karışıp karışmadığı (kenar rengi için).
              const groupHasSert = (g, gun, saat) => ihlaller.saatCakismalari.some(c=>c.gun===gun&&c.saat===saat&&c.groupKeys.includes(g.key));
              const groupHasAsim = (g, gun) => ihlaller.haftaIciAsimlari.some(c=>c.gun===gun&&c.groupKeys.includes(g.key));
              const toplamHaric = groups.reduce((a,g)=>a+((takvim[g.key]?.haric||[]).length),0);
              const otomatikCalistir = () => {
                const r = otomatikYerlestir(groups, takvim);
                setTakvim(r.takvim);
                setSonYerlestirmeRaporu(r.rapor);
              };
              return(
                <div>
                  {/* Unscheduled groups */}
                  {unscheduled.length>0&&(
                    <div style={{marginBottom:20}}>
                      <div style={{fontSize:12,color:"#f59e0b",fontWeight:600,marginBottom:10}}>⚠️ Planlanmamış etütler — gün ve saat seçin:</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                        {unscheduled.map(g=>{
                          const {color,emoji}=getMeta(g.ders);
                          const t = takvim[g.key]||{};
                          const gunDoluSayisi = (t.gun && !haftaSonuMu(t.gun))
                            ? (()=>{ const atamalar = takvimAtamalari(groups, takvim, g.key); return (g.ogrenciler||[]).filter(o=>(atamalar[o.ad]||[]).some(a=>a.gun===t.gun)).length; })()
                            : 0;
                          return(
                            <div key={g.key} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 14px",minWidth:200}}>
                              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                                <span>{emoji}</span>
                                <div>
                                  <div style={{fontSize:10,color,fontWeight:700,textTransform:"uppercase"}}>{g.ders}</div>
                                  <div style={{fontSize:11,color:"#e2e8f0"}}>{g.konu}</div>
                                </div>
                              </div>
                              <div style={{display:"flex",gap:6}}>
                                <select value={t.gun||""} onChange={e=>{
                                    const gun=e.target.value;
                                    setTakvim(prev=>{
                                      const next={...(prev[g.key]||{}),gun};
                                      if(next.gun&&next.saat) next.haric=slotCakisanlar(groups,{...prev,[g.key]:next},g.key,next.gun,next.saat);
                                      return {...prev,[g.key]:next};
                                    });
                                  }}
                                  style={{flex:1,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:6,padding:"4px 6px",color:"#f1f5f9",fontSize:11}}>
                                  <option value="">Gün seç</option>
                                  {GUNLER.map(gun=>{
                                    let label=gun;
                                    if(t.saat){
                                      const k=slotCakisanlar(groups,takvim,g.key,gun,t.saat).length;
                                      label = k>0 ? `${gun} (${k} çakışma)` : `${gun} ✓`;
                                    } else if(haftaSonuMu(gun)){
                                      label = `${gun} (hafta sonu)`;
                                    }
                                    return <option key={gun} value={gun}>{label}</option>;
                                  })}
                                </select>
                                <select value={t.saat||""} onChange={e=>{
                                    const saat=e.target.value;
                                    setTakvim(prev=>{
                                      const next={...(prev[g.key]||{}),saat};
                                      if(next.gun&&next.saat) next.haric=slotCakisanlar(groups,{...prev,[g.key]:next},g.key,next.gun,next.saat);
                                      return {...prev,[g.key]:next};
                                    });
                                  }}
                                  style={{flex:1,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:6,padding:"4px 6px",color:"#f1f5f9",fontSize:11}}>
                                  <option value="">Saat</option>
                                  {SAATLER.map(s=>{
                                    let label=s;
                                    if(t.gun){
                                      const k=slotCakisanlar(groups,takvim,g.key,t.gun,s).length;
                                      label = k>0 ? `${s} (${k} çakışma)` : `${s} ✓`;
                                    }
                                    return <option key={s} value={s}>{label}</option>;
                                  })}
                                </select>
                              </div>
                              {gunDoluSayisi>0&&(
                                <div style={{fontSize:10,color:"#ef4444",marginTop:6}}>⚠️ Bu gün {gunDoluSayisi} öğrenci için dolu</div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                  {/* Çakışma uyarı paneli */}
                  <div style={{marginBottom:20}}>
                    <div style={{fontSize:11,color:"#94a3b8",marginBottom:10}}>📏 Kural: Pzt–Cuma öğrenci başına günde en fazla 1 etüt · Cmt–Paz birden fazla olabilir · Aynı saatte iki etüt asla</div>
                    <div style={{display:"flex",gap:8,marginBottom:10}}>
                      <button className="btn" onClick={otomatikCalistir} style={{padding:"6px 14px",borderRadius:8,border:"1px solid rgba(99,102,241,0.3)",background:"rgba(99,102,241,0.1)",color:"#818cf8",fontWeight:600,fontSize:12}}>⚡ Otomatik yerleştir</button>
                      <button className="btn" onClick={()=>{setTakvim({});setSonYerlestirmeRaporu(null);}} style={{padding:"6px 14px",borderRadius:8,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.1)",color:"#f87171",fontWeight:600,fontSize:12}}>🗑️ Tüm planı temizle</button>
                    </div>
                    {ihlaller.saatCakismalari.length===0&&ihlaller.haftaIciAsimlari.length===0&&(
                      <div style={{background:"rgba(16,185,129,0.08)",border:"1px solid rgba(16,185,129,0.25)",borderRadius:10,padding:"8px 12px",fontSize:11,color:"#34d399"}}>
                        ✅ Çakışma yok — kural ihlali yok (hafta içi günde en fazla 1, aynı saatte tek etüt).
                      </div>
                    )}
                    {ihlaller.saatCakismalari.length>0&&(
                      <div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#ef4444",marginBottom:6}}>⛔ Saat çakışması</div>
                        {ihlaller.saatCakismalari.map((c,i)=>(
                          <div key={i} style={{fontSize:11,color:"#fca5a5",marginBottom:2}}>
                            {c.ad} — {c.gun} {c.saat}: {c.groupKeys.map(k=>{const gg=groups.find(x=>x.key===k);return gg?`${gg.ders}/${gg.konu}`:k;}).join(" + ")}
                          </div>
                        ))}
                      </div>
                    )}
                    {ihlaller.haftaIciAsimlari.length>0&&(
                      <div style={{background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#f59e0b",marginBottom:6}}>⚠️ Hafta içi aynı güne birden fazla etüt</div>
                        {ihlaller.haftaIciAsimlari.map((c,i)=>(

                            {/* Mini sparkline */}
                            {vals.length>1&&(
                              <svg width={W} height={H} style={{width:"100%",height:H,overflow:"visible"}}>
                                {/* threshold line */}
                                <line x1="0" y1={threshY} x2={W} y2={threshY} stroke="rgba(239,68,68,0.3)" strokeWidth="1" strokeDasharray="3,3"/>
                                {/* area fill */}
                                <polygon points={`10,${H} ${pts} ${defined[defined.length-1].x},${H}`} fill={color+"18"}/>
                                {/* line */}
                                <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
                                {/* dots */}
                                {defined.map((d,di)=>(
                                  <g key={di}>
                                    <circle cx={d.x} cy={H-Math.round((d.v/100)*(H-8)+4)} r="3" fill={color} stroke="#0f172a" strokeWidth="1.5"/>
                                    <text x={d.x} y={H-Math.round((d.v/100)*(H-8)+4)-6} textAnchor="middle" fontSize="8" fill="#94a3b8">{d.v}</text>
                                  </g>
                                ))}
                                {/* week labels */}
                                {t.weekAvgs.map((v,i)=>{
                                  const x=Math.round((i/(n-1||1))*(W-20)+10);
                                  return <text key={i} x={x} y={H+12} textAnchor="middle" fontSize="8" fill="#475569">{weeks[i]?.label?.replace("Hafta","H")}</text>;
                                })}
                              </svg>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    {sadeceDusenler&&!gorunenTrend.length&&(
                      <div data-konu-trend-bos style={{fontSize:12,color:"#94a3b8"}}>Düşen konu yok — filtreyi kapatınca tüm konular görünür.</div>
                    )}
                  </div>

                  {/* Öğrenci bazlı tablo */}
                  <div style={{fontFamily:"'Outfit',sans-serif",fontWeight:700,fontSize:15,color:"#f1f5f9",marginBottom:12}}>👤 Öğrenci Bazlı Gelişim</div>
                  {sadeceDusenler&&!dusenOgrenciler.length&&(
                    <div data-ogrenci-dusen-bos style={{fontSize:12,color:"#94a3b8",marginBottom:10}}>Düşüşü olan öğrenci yok — filtreyi kapatınca tüm öğrenciler görünür.</div>
                  )}
                  {(sadeceDusenler?dusenOgrenciler:allNames).map(name=>{
                    const hist=getStudentHistory(name);
                    if(hist.length<1) return null;
                    const {allTopics,hasImproved,hasDeclined}=ogrenciGelisimi(hist);
                    return(
                      <div key={name} data-karsilastir-ogrenci={name} data-ogrenci-dusus={hasDeclined?"1":"0"} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"14px 16px",marginBottom:10}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                          <div style={{width:28,height:28,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:11,color:"#fff"}}>{name.charAt(0)}</div>
                          <div style={{fontWeight:700,fontSize:13,color:"#f1f5f9",flex:1}}>{name}</div>
                          <div style={{display:"flex",gap:4}}>
                            {hasImproved&&<span style={{fontSize:10,background:"rgba(34,197,94,0.15)",color:"#34d399",padding:"2px 7px",borderRadius:8}}>📈 Gelişim var</span>}
                            {hasDeclined&&<span style={{fontSize:10,background:"rgba(239,68,68,0.15)",color:"#f87171",padding:"2px 7px",borderRadius:8}}>📉 Düşüş var</span>}
                          </div>
                        </div>
                        <div style={{overflowX:"auto"}}>
                          <table style={{borderCollapse:"collapse",fontSize:11,width:"100%"}}>
                            <thead><tr style={{background:"rgba(255,255,255,0.04)"}}>
                              <th style={{padding:"5px 10px",textAlign:"left",color:"#475569",fontWeight:700,borderBottom:"1px solid rgba(255,255,255,0.06)",minWidth:160}}>Ders / Konu</th>
                              {hist.map((h,i)=><th key={i} style={{padding:"5px 10px",textAlign:"center",color:"#818cf8",fontWeight:700,borderBottom:"1px solid rgba(255,255,255,0.06)",whiteSpace:"nowrap",minWidth:70}}>{h.label}</th>)}
                              <th style={{padding:"5px 10px",textAlign:"center",color:"#f59e0b",fontWeight:700,borderBottom:"1px solid rgba(255,255,255,0.06)"}}>±</th>
                            </tr></thead>
                            <tbody>
                              {allTopics.map((tk,ti)=>{
                                const [ders,konu]=tk.split("||");
                                const vals=hist.map(h=>{const k=h.student.konular.find(x=>x.ders===ders&&x.konu===konu);return k?Math.round(k.yuzde):null;});
                                const defined=vals.filter(v=>v!==null);
                                if(!defined.length) return null;
                                const diff=defined.length>1?defined[defined.length-1]-defined[0]:null;
                                return(
                                  <tr key={ti} style={{borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
                                    <td style={{padding:"5px 10px"}}>
                                      <div style={{fontSize:9,fontWeight:700,color:getMeta(ders).color,textTransform:"uppercase"}}>{ders}</div>
                                      <div style={{fontSize:11,color:"#cbd5e1"}}>{konu}</div>
                                    </td>
                                    {vals.map((v,vi)=>{
                                      const prev=vi>0?vals[vi-1]:null;
                                      const better=v!==null&&prev!==null&&v>prev;
                                      const worse=v!==null&&prev!==null&&v<prev;
                                      return(
                                        <td key={vi} style={{padding:"5px 10px",textAlign:"center",fontWeight:700,
                                          background:v===null?"transparent":better?"rgba(34,197,94,0.08)":worse?"rgba(239,68,68,0.08)":"transparent",
                                          color:v===null?"#334155":v<threshold?"#f87171":v<70?"#fbbf24":"#34d399",
                                          borderRadius:4}}>
                                          {v===null?"—":"%"+v}
                                          {better&&<span style={{fontSize:8,marginLeft:2}}>▲</span>}
                                          {worse&&<span style={{fontSize:8,marginLeft:2}}>▼</span>}
                                        </td>
                                      );
                                    })}
                                    <td style={{padding:"5px 10px",textAlign:"center",fontWeight:700,
                                      color:diff===null?"#475569":diff>0?"#34d399":diff<0?"#f87171":"#94a3b8"}}>
                                      {diff===null?"—":diff>0?"+"+diff+"%":diff+"%"}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<EtutSistemi />);
  </script>
</body>
</html>
