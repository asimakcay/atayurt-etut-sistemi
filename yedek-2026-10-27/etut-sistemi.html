// ─── PDF Parser (client-side via pdfjs) ─────────────────────────────────────
async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res(window.pdfjsLib);
    };
    s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function pdfPageToBase64(pdfDoc, pageNum) {
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale: 2.0 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  return dataUrl.split(',')[1];
}

// Tek bir PDF sayfasını analiz et: öğrenci adı + o sayfadaki ders/konu satırları.
// Her denemede konular ve sayfa düzeni DEĞİŞİR; sabit müfredat VARSAYMA, sayfada yazan metni AYNEN çıkar.
async function extractPageData(base64) {
  const prompt = `Bu bir deneme sınavı sonuç belgesinin TEK sayfası. Bir öğrenciye ait olabilir.

Görevin: SADECE bu sayfada gördüğün bilgileri çıkar. Sayfada olmayan hiçbir şeyi uydurma, tahmin etme.

1) ogrenci: Öğrencinin adı soyadı (genelde sayfanın üst kısmında). Bu sayfada yazmıyorsa "" (boş) bırak.
2) konular: "Konu Analizi" / "Kazanım Analizi" tablolarını SATIR DÜZENİYLE oku. Hiyerarşiyi tablonun KENDİ YAPISINDAN çıkar (girinti, satır başı "-" derinliği, BÜYÜK HARF / Başlık Düzeni, ders başlığı satırı); sabit konu listesi VARSAYMA.
   Ders başlığının hemen altındaki İLK seviye = ANA KONU. Bir seviye içerisi = ALT BAŞLIK. Daha içerisi veya cümle biçimli satırlar ("… bulur.", "…-ebilme") = KAZANIM.
   Her ANA KONU için bir nesne:
   - ders: dersin adı (ör. TÜRKÇE, MATEMATİK, FEN BİLİMLERİ, SOSYAL BİLGİLER, İNGİLİZCE, DİN KÜLTÜRÜ) — sayfada yazıldığı gibi
   - konu: ana konunun adı — SAYFADA YAZILDIĞI GİBİ BİREBİR. Boşlukları ve Türkçe karakterleri (ç ğ ı İ ö ş ü) aynen koru. Kısaltma, çeviri, yeniden yazım YAPMA. Bir ad iki satıra bölünmüşse tek boşlukla birleştir; iki ayrı satırı boşluksuz yapıştırma ("Classroom rulesAsking…" YANLIŞ).
   - yuzde: ana konunun KENDİ satırındaki başarı yüzdesi, 0-100 arası tam sayı. "%" sütunu varsa onu kullan; yoksa doğru / soru * 100. Ana konu satırında sayı yoksa null yaz (alt başlıklardan hesaplanır).
   - soru, dogru: ana konunun KENDİ satırındaki soru sayısı ("Sayı" / "Soru") ve doğru sayısı; yoksa null (birleşik etüt soru ağırlıklı ortalaması için).
   - altBasliklar: ana konunun bir seviye içindeki başlık satırları, her biri {baslik, yuzde, kazanimlar:[{kazanim, yuzde}]}. Yoksa [].
   - kazanimlar: ana konunun doğrudan altındaki kazanım satırları, her biri {kazanim, yuzde}. Yoksa [].
   Alt başlığı veya kazanımı AYRI ana konu olarak YAZMA. Her derste aynı kural: satır başında BOŞLUKSUZ “-” ile başlayan büyük harfli satır = ana konu; önünde boşluk / girinti olan “- ” satırı alt başlık veya kazanımdır, asla ana konu değildir.
3) dersOzet: SADECE bu sayfada "Ders Analizi" özet tablosu var ama konu tablosu yoksa doldur. Her ders için {ders, net, soru}. Konu tablosu varsa bunu boş bırak.

SADECE geçerli JSON döndür, başka hiçbir metin, açıklama veya markdown yazma:
{"ogrenci":"","konular":[{"ders":"","konu":"","yuzde":0,"soru":null,"dogru":null,"altBasliklar":[{"baslik":"","yuzde":0,"kazanimlar":[{"kazanim":"","yuzde":0}]}],"kazanimlar":[{"kazanim":"","yuzde":0}]}],"dersOzet":[{"ders":"","net":0,"soru":0}]}`;

  let data;
  try {
    const raw = await callClaude(base64, "image/jpeg", prompt);
    data = safeJsonParse(raw);
  } catch(e) {
    console.error("Sayfa analizi hatası:", e);
    if (String(e && e.message || "").includes("anahtar")) throw e;
    return null;
  }
  if (!data || typeof data !== "object") return null;

  const konular = Array.isArray(data.konular) ? data.konular
    .filter(k => k && k.ders && k.konu != null && String(k.konu).trim() !== "")
    .map(k => ({
      ders: String(k.ders).trim(),
      konu: String(k.konu).trim(),
      yuzde: _yuzdeSayi(k.yuzde),
      soru: soruSayisi(k), dogru: dogruSayisi(k), // birleşik etüt soru ağırlıklı ortalaması için (1509-agirlik)
      altBasliklar: altBaslikListesiTemizle(k.altBasliklar),
      kazanimlar: kazanimListesiTemizle(k.kazanimlar)
    })) : [];
  const dersOzet =Array.isArray(data.dersOzet) ? data.dersOzet
    .filter(d => d && d.ders)
    .map(d => ({ ders: String(d.ders).trim(), net: Number(d.net) || 0, soru: Number(d.soru) || 0 })) : [];
  const ogrenci = (data.ogrenci && String(data.ogrenci).trim().length > 2) ? String(data.ogrenci).trim() : "";

  if (!ogrenci && konular.length === 0 && dersOzet.length === 0) return null;
  return { ogrenci, konular, dersOzet };
}

// ─── AI helpers ──────────────────────────────────────────────────────────────
const ANTHROPIC_MODEL = "claude-sonnet-4-20250514";

// API anahtarı yalnızca tarayıcıda localStorage'da tutulur; koda gömülmez, sunucuya gitmez, commit edilmez.
// Kullanıcı prompt'u iptal ederse (boş bırakırsa) bir daha sormamak için bu bayrağı kullan —
// aksi halde çok sayfalı bir PDF'te her sayfa için ayrı ayrı diyalog açılır.
let keyPromptIptal = false;
function getAnthropicKey() {
  let key = "";
  try { key = window.localStorage.getItem("ANTHROPIC_API_KEY") || ""; } catch(e) {}
  if (!key && !keyPromptIptal) {
    key = (window.prompt("Anthropic API anahtarını girin (sk-ant-...). Tarayıcıda saklanır, sunucuya gönderilmez.") || "").trim();
    if (key) { try { window.localStorage.setItem("ANTHROPIC_API_KEY", key); } catch(e) {} }
    else { keyPromptIptal = true; }
  }
  return key;
}

// Markdown çiti (```json ... ```) veya araya karışan açıklama metnini temizleyen güvenli JSON parse.
// Başarısız olursa hata fırlatmaz, null döner.
function safeJsonParse(raw) {
  if (raw == null) return null;
  let s = String(raw).trim();
  s = s.replace(/^﻿/, "").replace(/^\s*```(?:json)?\s*/i, "").replace(/\s*```\s*$/i, "").trim();
  try { return JSON.parse(s); } catch(e) {}
  const m = s.match(/[\{\[][\s\S]*[\}\]]/); // metne gömülü ilk { } veya [ ] bloğu
  if (m) { try { return JSON.parse(m[0]); } catch(e) {} }
  return null;
}

async function callClaude(base64Data, mediaType, prompt) {
  const validType = ["image/jpeg","image/png","image/gif","image/webp"].includes(mediaType) ? mediaType : "image/jpeg";
  const apiKey = getAnthropicKey();
  if (!apiKey) throw new Error("API anahtarı girilmedi");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: ANTHROPIC_MODEL, max_tokens: 8000,
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: validType, data: base64Data } },
        { type: "text", text: prompt }
      ]}]
    })
  });
  let d;
  try { d = await res.json(); } catch(e) { throw new Error("API yanıtı okunamadı (HTTP " + res.status + ")"); }
  if (!res.ok || d?.type === "error" || !Array.isArray(d?.content)) {
    const msg = d?.error?.message || d?.message || ("HTTP " + res.status);
    if (res.status === 401) { try { window.localStorage.removeItem("ANTHROPIC_API_KEY"); } catch(e) {} }
    throw new Error("Claude API hatası: " + msg);
  }
  return d.content.map(i => i.text || "").join("").replace(/```json|```/g, "").trim();
}

async function extractFromImage(base64Data, fileName, mediaType = "image/jpeg") {
  let ogrenciAdi = fileName;
  try {
    const raw = await callClaude(base64Data, mediaType,
      `Bu bir öğrenci sınav sonuç belgesi. Sayfanın sağ üst bölümünde öğrencinin adı soyadı büyük harflerle yazıyor.
Örnek: DEFNE ÇELİK veya ZEYNEP GÜNER veya KEREM DEMİR

Sadece öğrencinin adını ve soyadını yaz. Başka hiçbir şey yazma.
Cevap:`);
    // Take first line only, strip everything except Turkish letters and spaces
    const firstLine = raw.trim().split("\n")[0].trim();
    const c = firstLine.replace(/[^a-zA-ZçÇğĞıİöÖşŞüÜ\s]/g, "").trim();
    if (c.length > 2 && c.length < 60) ogrenciAdi = c;
  } catch(e) { console.warn("İsim okunamadı:", fileName); }

  let konular = [];
  try {
    const raw = await callClaude(base64Data, mediaType,
      `Bu belgede ders bazlı "Konu Analizi" / "Kazanım Analizi" tabloları var.
Hiyerarşi: Ders → Ana konu → Alt başlık → Kazanım. Hiyerarşiyi tablonun KENDİ YAPISINDAN çıkar (girinti, satır başı "-" derinliği, BÜYÜK HARF / Başlık Düzeni); sabit konu listesi varsayma. Her derste aynı kural: satır başında boşluksuz “-” ile başlayan büyük harfli satır = ana konu; önünde boşluk / girinti olan “- ” satırı alt başlık veya kazanımdır, asla ana konu değildir. Ders başlığının altındaki ilk seviye = ana konu, bir seviye içerisi = alt başlık, daha içerisi / cümle biçimli satır = kazanım.
- ders: dersin adı, sayfada yazıldığı gibi.
- konu: ANA KONU adı — SAYFADA YAZILDIĞI GİBİ BİREBİR. Boşlukları ve Türkçe karakterleri (ç ğ ı İ ö ş ü) aynen koru. Kısaltma, çeviri, düzeltme yapma.
- yuzde: ana konunun KENDİ satırındaki % (yoksa doğru / soru * 100). Satırında sayı yoksa null. 0-100 tam sayı.
- soru, dogru: ana konunun kendi satırındaki soru ("Sayı") ve doğru sayısı; yoksa null.
- altBasliklar: bir seviye içerideki başlıklar, her biri {baslik, yuzde, kazanimlar:[{kazanim, yuzde}]}. Yoksa [].
- kazanimlar: ana konunun doğrudan altındaki kazanım satırları, her biri {kazanim, yuzde}. Yoksa [].
- Alt başlığı veya kazanımı ayrı ana konu olarak yazma. Renkli / vurgulu satırlar dahil hepsini al.
SADECE geçerli JSON döndür, başka metin yazma:
{"konular":[{"ders":"","konu":"","yuzde":0,"soru":null,"dogru":null,"altBasliklar":[{"baslik":"","yuzde":0,"kazanimlar":[{"kazanim":"","yuzde":0}]}],"kazanimlar":[{"kazanim":"","yuzde":0}]}]}`);
    const parsed = safeJsonParse(raw);
    konular = (parsed && Array.isArray(parsed.konular)) ? parsed.konular
      .filter(k => k && k.ders && k.konu != null && String(k.konu).trim() !== "")
      .map(k => ({
        ders: String(k.ders).trim(),
        konu: String(k.konu).trim(),
        yuzde: _yuzdeSayi(k.yuzde),
        soru: soruSayisi(k), dogru: dogruSayisi(k),
        altBasliklar: altBaslikListesiTemizle(k.altBasliklar),
        kazanimlar: kazanimListesiTemizle(k.kazanimlar)
      })) : [];
  } catch(e) { console.error("Konu okunamadı:", e); }
  // Flag if name looks like a UUID, hash or filename (not a real person name)
  // Looks like a real name: only Turkish/Latin letters and spaces, at least 2 words, no digits
  const nameStr = ogrenciAdi.trim();
  const hasOnlyLettersAndSpaces = /^[a-zA-ZçÇğĞıİöÖşŞüÜ\s]+$/.test(nameStr);
  const hasTwoWords = nameStr.split(/\s+/).filter(w => w.length > 0).length >= 2;
  const hasNoDigits = !/\d/.test(nameStr);
  const notTooLong = nameStr.length < 50;
  const looksLikeName = hasOnlyLettersAndSpaces && hasTwoWords && hasNoDigits && notTooLong;
  return { ogrenci: ogrenciAdi, konular, nameUnknown: !looksLikeName };
}

// @@KONU-HIYERARSI-BASLA
// Karne hiyerarşisi: Ders → Ana konu (etüt birimi) → Alt başlık → Kazanım. Etüt grubu / eşik / takvim YALNIZ ana konu
// düzeyinde çalışır; alt başlık ve kazanım etüt açmaz.
// 1409c (kullanıcı 14.09): ayrım BELGENİN YAPISINDAN gelir — konu adı listesi (whitelist) YOKTUR. Sinyaller, öncelik sırasıyla:
//   1) açık seviye: PDF metin katmanındaki girinti (`seviye`), Vision/JSON'daki iç içe {konu, altBasliklar[], kazanimlar[]}
//   2) cümle biçimi: noktayla biten, "-ebilme", "yönelik", "Students will…" satırları kazanımdır
//   3) haftanın yapısı: aynı derste başka bir öğrencide alt başlık olarak geçen ad, düz listede de alt başlıktır
//   4) harf düzeni: bir derste BÜYÜK HARF ve Başlık Düzeni başlıklar karışıksa BÜYÜK HARF = ana konu, diğerleri = alt başlık
//   5) yedek (yalnız yapı sinyali yoksa): dil becerisi alan adları (Okuma, Yazma…) alt başlıktır
// 1409d (kullanıcı 14.09, TÜM dersler): açık seviye KESİNDİR. Ders altında satır başında boşluksuz "-" (seviye 1) + büyük harf = ana konu;
//   önünde boşluk / girinti olan satır (seviye ≥ 2) alt başlık veya kazanımdır ve hiçbir sinyalle (haftanın yapısı, ad eşleşmesi) ana konu olmaz.
//   Seviye yoksa (eski Vision JSON) 2-5 numaralı sinyaller devreye girer.
// Ana konu yüzdesi: karnede ana konunun kendi satırı varsa o (soru ağırlıklı toplam); yoksa alt başlıkların basit ortalaması.
// Saf JS — test-1409-konu.mjs ve test-1409c-fen.mjs bu bloğu node'da çalıştırır; JSON / PDF / foto / DEMO aynı yoldan geçer.
// Metin sinyalleri saf fonksiyon; aynı konu adları yüzlerce öğrencide tekrarlandığı için sonuçlar önbelleklenir (JSON/PDF yükleme hızı).
function _onbellekli(fn) {
  const onbellek = new Map();
  return (s) => {
    const a = String(s == null ? "" : s);
    let v = onbellek.get(a);
    if (v === undefined) { if (onbellek.size > 20000) onbellek.clear(); v = fn(a); onbellek.set(a, v); }
    return v;
  };
}
const trKatla = _onbellekli(a => a
  .replace(/[‘’`´]/g, "'")
  .toLocaleUpperCase("tr-TR")
  .replace(/Ç/g, "C").replace(/Ğ/g, "G").replace(/İ/g, "I").replace(/Ö/g, "O").replace(/Ş/g, "S").replace(/Ü/g, "U").replace(/Â/g, "A")
  .replace(/\s+/g, " ").trim());
// "Türkçe-5", "Türkçe.05", "TÜRKÇE" → aynı ders (karnede bölüm son ekleri).
function dersKatla(ders) {
  return trKatla(ders).replace(/[\s.\-–]*\d+$/, "").trim();
}
// Harflerin en az %80'i büyükse BÜYÜK HARF başlık ("TEKNOLOJİ ve SOSYAL BİLİMLER" dahil).
const buyukHarfMi = _onbellekli(metin => {
  const harfler = metin.match(/\p{L}/gu) || [];
  if (harfler.length < 2) return false;
  const buyuk = harfler.filter(h => h !== h.toLocaleLowerCase("tr-TR")).length;
  return buyuk / harfler.length >= 0.8;
});
// Seviye 1 satırı büyük harfle mi başlıyor ("SAYILAR…", "Animals", "Hello!") — ALL CAPS olmayan ana konu başlıkları (İngilizce) dahil.
const buyukHarfleBaslarMi = _onbellekli(metin => {
  const h = metin.match(/\p{L}/u);
  return !!h && h[0] !== h[0].toLocaleLowerCase("tr-TR");
});
// Metin satır başı işaretiyle gelirse (yapıştırılmış metin, ham Vision satırı): "- ANA KONU" boşluksuz, "  - Alt başlık" girintili.
const _TIRE_RE = /^([ \t\u00a0]*)[-–•]\s+/;
// Kazanım cümlelerinin sonundaki fiiller ("Kelimelerin zıt anlamlılarını bulur.", "... ayırt eder") — dil sinyali, konu adı değil.
const KAZANIM_FIILLERI = ["ACIKLAR", "TANIMLAR", "BELIRLER", "DEGERLENDIRIR", "SORGULAR", "GELISTIRIR", "TASARLAR", "BULUR", "KURAR", "OKUR",
  "HESAPLAR", "COZER", "YORUMLAR", "KARSILASTIRIR", "SINIFLANDIRIR", "EDER", "OLUSTURUR", "KULLANIR", "GOSTERIR", "SIRALAR", "UYGULAR", "CIZER", "OLCER", "DONUSTURUR"];
const _kazanimFiilSet = new Set(KAZANIM_FIILLERI);
const cumleKazanimMi = _onbellekli(metin => {
  const ham = metin.trim();
  if (!ham) return false;
  const k = trKatla(ham);
  if (/\.\)?$/.test(ham)) return true;          // cümle noktayla biter
  if (ham.startsWith("(")) return true;         // "(Öznel/Nesnel cümleleri ayırt eder.)"
  if (/[AE]BILME$/.test(k)) return true;        // ...yapabilme / ...edebilme
  if (/(^| )YONELIK( |$)/.test(k)) return true;
  if (/BE ABLE TO|STUDENTS WILL/.test(k)) return true;
  const kelimeler = k.split(" ");
  return kelimeler.length >= 3 && _kazanimFiilSet.has(kelimeler[kelimeler.length - 1]);
});
// YEDEK sinyal: dil becerisi alanları. Yalnız belgede yapı yoksa (düz liste, seviye yok, harf düzeni karışık değil) kullanılır.
const BECERI_ALANLARI_YEDEK = ["OKUMA", "SÖZ VARLIĞI", "DİNLEME", "İZLEME", "DİNLEME/İZLEME", "DİNLEME / İZLEME", "KONUŞMA", "YAZMA"];
const _beceriSet = new Set(BECERI_ALANLARI_YEDEK.map(trKatla));
function beceriAlaniMi(metin) { return _beceriSet.has(trKatla(metin)); }
// Geriye uyum: "tek başına etüt birimi olamayan başlık mı" (cümle kazanımı veya beceri alanı).
function kazanimMi(ders, konu) { return cumleKazanimMi(konu) || beceriAlaniMi(konu); }

function _yuzdeSayi(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : null;
}
function kazanimListesiTemizle(arr) {
  return (Array.isArray(arr) ? arr : [])
    .filter(z => z && (z.kazanim || z.konu))

// ─── Excel export (client-side CSV→XLSX via SheetJS) ─────────────────────────
function exportExcel(students, groups, threshold, weekLabel) {
  // Build workbook sheets as 2D arrays then download via SheetJS
  const XLSX = window.XLSX;
  if (!XLSX) { alert("SheetJS yükleniyor, lütfen bekleyin..."); return; }
  const wb = XLSX.utils.book_new();

  // Sheet 1: Öğrenci × Konu matrisi
  const allKeys = [...new Set(students.flatMap(s => s.konular.map(k => `${k.ders}||${k.konu}`)))];
  const headers = ["Öğrenci", ...allKeys.map(k => k.split("||")[1])];
  const matrixRows = [headers];
  students.forEach(s => {
    const row = [s.ogrenci];
    allKeys.forEach(key => {
      const [ders, konu] = key.split("||");
      const k = s.konular.find(x => x.ders === ders && x.konu === konu);
      row.push(k ? Math.round(k.yuzde) : "");
    });
    matrixRows.push(row);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(matrixRows);
  // Color cells below threshold red
  XLSX.utils.book_append_sheet(wb, ws1, "Öğrenci×Konu Matrisi");

  // Sheet 2: Etüt grupları
  const groupRows = [["Ders","Konu","Öğrenci Sayısı","Grup Ort. %","Öğrenciler (ad - %)"]];
  groups.forEach(g => {
    groupRows.push([g.ders, g.konu, g.ogrenciler.length, g.ortalama,
      g.ogrenciler.map(o => `${o.ad} (%${Math.round(o.yuzde)})`).join(", ")]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(groupRows), "Etüt Grupları");

  // Sheet 3: Öğrenci bazlı etüt planı
  const planRows = [["Öğrenci","Bu Hafta Etütleri","Etüt Konuları Detay"]];
  students.forEach(s => {
    const myG = groups.filter(g => g.ogrenciler.some(o => o.ad === s.ogrenci));
    planRows.push([
      s.ogrenci,
      myG.length === 0 ? "Etüt yok" : `${myG.length} etüt`,
      myG.map(g => { const me = g.ogrenciler.find(o => o.ad === s.ogrenci);
        return `${g.ders} - ${g.konu} (%${Math.round(me?.yuzde??0)})`; }).join(" | ")
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(planRows), "Öğrenci Etüt Planı");

  // Sheet 4: Ders ortalamaları
  const dersler = [...new Set(students.flatMap(s => s.konular.map(k => k.ders)))];
  const avgRows = [["Ders","Konu","Sınıf Ort. %",`Aralıktaki (${genelAralikMetni()}) Öğrenci Sayısı`]];
  const topicMap = {};
  students.forEach(s => s.konular.forEach(k => {
    const key = `${k.ders}||${k.konu}`;
    if (!topicMap[key]) topicMap[key] = { ders:k.ders, konu:k.konu, vals:[] };
    topicMap[key].vals.push(k.yuzde);
  }));
  Object.values(topicMap).sort((a,b) => a.ders.localeCompare(b.ders)).forEach(t => {
    const avg = Math.round(t.vals.reduce((a,v)=>a+v,0)/t.vals.length);
    const below = t.vals.filter(v => genelAraliktaMi(v)).length;
    avgRows.push([t.ders, t.konu, avg, below]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(avgRows), "Ders Ortalamaları");

  XLSX.writeFile(wb, `etut-plani-${weekLabel || "hafta"}.xlsx`);
}

// @@TAKVIM-KURALI-BASLA
const HAFTA_ICI = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma"];
const HAFTA_SONU = ["Cumartesi","Pazar"];
const GUNLER = [...HAFTA_ICI, ...HAFTA_SONU];
const SAATLER = ["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00"];
const HAFTA_ICI_GUNLUK_LIMIT = 1;
function haftaSonuMu(gun) { return HAFTA_SONU.includes(gun); }

// takvim şekli: { [groupKey]: { gun, saat, haric?: string[] } }  — haric = bu etüde alınmayan öğrenci adları
// groups: [{ key, ders, konu, ogrenciler:[{ad, yuzde}] }] — sırası = öncelik (en zayıf önce)

// Geçerli (gun+saat dolu, GUNLER/SAATLER içinde) ve gruplarda karşılığı olan her takvim kaydını
// öğrenci bazında atama listesine çevirir. haricTut verilirse o groupKey tamamen yok sayılır.
function takvimAtamalari(groups, takvim, haricTut) {
  const sonuc = {};
  const groupMap = {};
  (groups || []).forEach(g => { groupMap[g.key] = g; });
  Object.entries(takvim || {}).forEach(([groupKey, t]) => {
    if (!t || groupKey === haricTut) return;
    const gun = t.gun, saat = t.saat;
    if (!gun || !saat || !GUNLER.includes(gun) || !SAATLER.includes(saat)) return;
    const g = groupMap[groupKey];
    if (!g) return;
    const haricSet = new Set(t.haric || []);
    (g.ogrenciler || []).forEach(o => {
      if (haricSet.has(o.ad)) return;
      if (!sonuc[o.ad]) sonuc[o.ad] = [];
      sonuc[o.ad].push({ gun, saat, groupKey });
    });
  });
  return sonuc;
}

// groupKey grubundaki öğrencilerden (grubun kendi mevcut planı YOK SAYILARAK) bu gün+saate
// konursa kuralı bozacak olanları döndürür: aynı gün+saatte başka etüdü olan VEYA
// (gün hafta içiyse) o gün başka herhangi bir etüdü olan.
function slotCakisanlar(groups, takvim, groupKey, gun, saat) {
  const g = (groups || []).find(x => x.key === groupKey);
  if (!g) return [];
  const atamalar = takvimAtamalari(groups, takvim, groupKey);
  const sonuc = [];
  (g.ogrenciler || []).forEach(o => {
    const list = atamalar[o.ad] || [];
    const cakisir = list.some(a => (a.gun === gun && a.saat === saat) || (!haftaSonuMu(gun) && a.gun === gun));
    if (cakisir) sonuc.push(o.ad);
  });
  return sonuc;
}

// Mevcut takvime göre tüm kural ihlallerini raporlar. haric öğrenciler sayılmaz.
function takvimIhlalleri(groups, takvim) {
  const atamalar = takvimAtamalari(groups, takvim);
  const saatCakismalari = [];
  const haftaIciAsimlari = [];
  Object.entries(atamalar).forEach(([ad, list]) => {
    const bySlot = {};
    list.forEach(a => {
      const k = a.gun + "|" + a.saat;
      (bySlot[k] = bySlot[k] || []).push(a.groupKey);
    });
    Object.entries(bySlot).forEach(([k, groupKeys]) => {
      if (groupKeys.length > 1) {
        const [gun, saat] = k.split("|");
        saatCakismalari.push({ ad, gun, saat, groupKeys });
      }
    });
    const byGun = {};
    list.forEach(a => {
      if (!HAFTA_ICI.includes(a.gun)) return;
      (byGun[a.gun] = byGun[a.gun] || []).push(a.groupKey);
    });
    Object.entries(byGun).forEach(([gun, groupKeys]) => {
      if (groupKeys.length > HAFTA_ICI_GUNLUK_LIMIT) {
        haftaIciAsimlari.push({ ad, gun, groupKeys });
      }
    });
  });
  return { saatCakismalari, haftaIciAsimlari };
}

// GUNLER × SAATLER sırasıyla (Pazartesi 08:00 → … → Pazar 17:00) slotCakisanlar uzunluğu
// EN AZ olan ilk slotu döndürür. Grubun tüm öğrencileri her slotta çakışıyorsa null.
function slotSec(groups, takvim, groupKey) {
  const g = (groups || []).find(x => x.key === groupKey);
  if (!g) return null;
  const toplam = (g.ogrenciler || []).length;
  let best = null;
  for (const gun of GUNLER) {
    for (const saat of SAATLER) {
      const haric = slotCakisanlar(groups, takvim, groupKey, gun, saat);
      if (!best || haric.length < best.haric.length) {
        best = { gun, saat, haric };
        if (haric.length === 0) return best;
      }
    }
  }
  if (best && toplam > 0 && best.haric.length === toplam) return null;
  return best;
}

// groups'u SIRASIYLA işler (en zayıf önce). Boş yeni takvimle başlar.
// Eski takvimde geçerli gun+saat'i olan grup korunur (haric yeniden hesaplanır).
// Plansız grup slotSec ile yerleştirilir; slot yoksa yeni takvime yazılmaz.
function otomatikYerlestir(groups, takvim) {
  const yeniTakvim = {};
  const rapor = [];
  (groups || []).forEach(g => {
    const eski = takvim ? takvim[g.key] : null;
    const eskiGecerli = eski && eski.gun && eski.saat && GUNLER.includes(eski.gun) && SAATLER.includes(eski.saat);
    if (eskiGecerli) {
      const haric = slotCakisanlar(groups, yeniTakvim, g.key, eski.gun, eski.saat);
      yeniTakvim[g.key] = { gun: eski.gun, saat: eski.saat, haric };
      rapor.push({ groupKey: g.key, gun: eski.gun, saat: eski.saat, haric, durum: "korundu" });
    } else {
      const slot = slotSec(groups, yeniTakvim, g.key);
      if (slot) {
        yeniTakvim[g.key] = { gun: slot.gun, saat: slot.saat, haric: slot.haric };
        rapor.push({ groupKey: g.key, gun: slot.gun, saat: slot.saat, haric: slot.haric, durum: "yerlesti" });
      } else {
        rapor.push({ groupKey: g.key, gun: null, saat: null, haric: [], durum: "yerlesemedi" });
      }
    }
  });
  return { takvim: yeniTakvim, rapor };
}

// @@PROGRAM-KURALI-BASLA
// Haftalık Etüt Programı (v15 düzeni, 1409b'de geri getirildi): gün kartları → oturumlar (ders/grup, saat, hoca, kapasite, öğrenciler).
// gün: { id, gunAdi, tarih }   oturum: { id, gunId, grupKey, ders, konu, saat, hoca, kapasite, ogrenciler:[ad], konuAcik, sira }
// Kural burada YENİDEN YAZILMAZ: program @@TAKVIM-KURALI şekline çevrilir (oturum = grup, gün kartının adı = gun)
// ve slotCakisanlar / takvimIhlalleri aynen kullanılır → hafta içi günde 1, hafta sonu çoklu, aynı gün+saat asla.
// Aynı adı taşıyan iki gün kartı (ör. iki "Pazartesi") aynı gün sayılır.
const PROGRAM_KAPASITE = 10;
// 2710-kapsinir: üst sınır kaldırıldı (alt sınır 1).
// Sıra (eşik üstü doldurma) öğrencisinin zemin rengi: 5. sınıf ders renklerinde (mavi/kırmızı/yeşil/turuncu/mor/camgöbeği) yok,
// bakınca eşik altından ayrılır (kullanıcı 15.09). Metin lacivert.
const PROGRAM_SIRA_RENK = "#facc15";
const PROGRAM_SIRA_METIN = "#1e1b4b";

// ── Öğrenci müsaitliği (kullanıcı 15.09, 1509-musait) ──
// musaitlik: { [programAdAnahtari(ad)]: ["Çarşamba", ...] } = öğrencinin GELEMEDİĞİ günler. Kaydı olmayan öğrenci her gün müsait
// (varsayılan eski davranış). Atama fonksiyonlarına son (isteğe bağlı) parametre olarak verilir; verilmezse hepsi müsait.
// Müsait olmayan güne otomatik/elle yazılmaz; kural (çakışma, zayıf önce) aynen durur.

const MUSAIT_OVERRIDE_KEY = "ATAYURT_MUSAITLIK_YEDEK_V1"; // yalnız yedek sürümde elle yapılan değişiklikler (Excel'den fark)
function musaitAdKatla(s) { return trKatla(String(s || "")).toLocaleUpperCase("tr-TR").replace(/Ç/g,"C").replace(/Ğ/g,"G").replace(/[Iİ]/g,"I").replace(/Ö/g,"O").replace(/Ş/g,"S").replace(/Ü/g,"U").replace(/[^A-Z ]/g,"").replace(/\s+/g," ").trim(); }
function musaitSubeKatla(s) { return String(s || "").toLocaleUpperCase("tr-TR").replace(/[^0-9A-ZÇĞİÖŞÜ]/g, ""); }
function _duzeltmeMesafesi1(a, b) { // ≤1 düzenleme mi
  if (a === b) return true; const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, f = 0;
  while (i < la && j < lb) { if (a[i] === b[j]) { i++; j++; continue; } if (++f > 1) return false; if (la > lb) i++; else if (lb > la) j++; else { i++; j++; } }
  return f + (la - i) + (lb - j) <= 1;
}
// Öğrenci (ad + şube) → Excel kaydı. tam: aynı şube + aynı ad; yakın: aynı şube, Türkçe harf katlanmış eşit veya 1 harf farkı (tek aday).
function musaitEslestir(ogrenciler) {
  const kayitlar = Object.entries(GOMULU_MUSAITLIK_SUBE).map(([k, v]) => { const [sb, ad] = k.split("|"); return { sb: musaitSubeKatla(sb), ad, katli: musaitAdKatla(ad), kapali: v, sube: sb }; });
  const sonuc = {};
  (ogrenciler || []).forEach(s => {
    const goster = String(s.ogrenci || ""); const temiz = programAdAnahtari(goster.replace(/\s*\([^()]+\)\s*$/, ""));
    const sb = musaitSubeKatla(s.sube || (goster.match(/\(([^()]+)\)\s*$/) || [])[1]);
    const ayniSube = kayitlar.filter(k => !sb || k.sb === sb);
    let e = ayniSube.find(k => k.ad === temiz), tur = "tam";
    if (!e) { const kt = musaitAdKatla(temiz); const ad = ayniSube.filter(k => k.katli === kt); const ad2 = ad.length ? ad : ayniSube.filter(k => _duzeltmeMesafesi1(k.katli, kt)); if (ad2.length === 1) { e = ad2[0]; tur = "yakın"; } }
    sonuc[programAdAnahtari(goster)] = e ? { tur, excelAd: e.ad, sube: e.sube, kapali: e.kapali } : { tur: "yok" };
  });
  return sonuc;
}

const GUN_KISA = { "Pazartesi": "Pzt", "Salı": "Sal", "Çarşamba": "Çar", "Perşembe": "Per", "Cuma": "Cum", "Cumartesi": "Cmt", "Pazar": "Paz" };
function programAdAnahtari(ad) { return String(ad || "").trim().replace(/\s+/g, " ").toLocaleUpperCase("tr-TR"); }
function programMusaitMi(musaitlik, ad, gunAdi) {
  if (!musaitlik || !gunAdi) return true;
  const kapali = musaitlik[programAdAnahtari(ad)];
  return !Array.isArray(kapali) || !kapali.includes(gunAdi);
}
// Program kartlarında öğrencinin gelemediği günler (GUNLER sırasıyla).
function programKapaliGunler(musaitlik, ad) {

}

// "+ Gün Ekle": programda henüz olmayan ilk gün (Pzt → … → Cumartesi → Pazar); yedi gün de varsa haftayı yeniden dolaşır.
function programSonrakiGun(programGunler) {
  const var_ = new Set((programGunler || []).map(g => g.gunAdi));
  return GUNLER.find(g => !var_.has(g)) || GUNLER[(programGunler || []).length % GUNLER.length];
}

function programTakvimSekli(programGunler, programOturumlar) {
  const gunAdi = {};
  (programGunler || []).forEach(g => { gunAdi[g.id] = g.gunAdi; });
  const groups = [];
  const takvim = {};
  (programOturumlar || []).forEach(o => {
    groups.push({ key: o.id, ders: o.ders, konu: o.konu, ogrenciler: (o.ogrenciler || []).map(ad => ({ ad })) });
    takvim[o.id] = { gun: gunAdi[o.gunId], saat: o.saat };
  });
  return { groups, takvim };
}

// `ad` bu oturuma (kendi gün+saatine) eklenirse kural bozulur mu? Oturumun kendisi yok sayılır.
function programCakisiyor(programGunler, programOturumlar, oturumId, ad) {
  const { groups, takvim } = programTakvimSekli(programGunler, programOturumlar);
  const t = takvim[oturumId];
  if (!t || !t.gun || !t.saat) return false;
  const tekli = groups.map(g => g.key === oturumId ? { ...g, ogrenciler: [{ ad }] } : g);
  return slotCakisanlar(tekli, takvim, oturumId, t.gun, t.saat).length > 0;
}

// Oturumun mevcut öğrencilerini korur, kapasiteye kadar tamamlar (kullanıcı 15.09, 1509-esik-sirala):
// önce etüt grubunun eşik altı öğrencileri (en zayıf önce); onlar bitince AYNI grubun eşik üstü öğrencileri
// (`grp.esikUstu`, yüzde artan, üst sınır yok). İki turda da aynı grubun başka oturumundakiler ve kuralı bozacaklar atlanır.
// Eşik altı her zaman sıranın önündedir: yeniden doldurmada (kapasite değişimi) oturumdaki sıra öğrencileri, yerleşebilen
// eşik altı adaylardan sonra gelir → kapasite düşerse önce sıra düşer. Dönüş ad listesi; kaynak `programKaynak` ile türetilir.
function programAdaylari(groups, programGunler, programOturumlar, oturumId, musaitlik) {
  const o = (programOturumlar || []).find(x => x.id === oturumId);
  const grp = o && (groups || []).find(g => g.key === o.grupKey);
  if (!grp) return o ? (o.ogrenciler || []) : [];
  const gunAdi = (programGunler || []).find(g => g.id === o.gunId)?.gunAdi;
  const zatenGrupta = new Set((programOturumlar || [])
    .filter(x => x.id !== oturumId && x.grupKey === o.grupKey)
    .flatMap(x => x.ogrenciler || []));
  const siraAdlari = new Set((grp.esikUstu || []).map(s => s.ad));
  const mevcut = o.ogrenciler || [];
  const secilen = mevcut.filter(a => !siraAdlari.has(a)).slice(0, o.kapasite);
  const aday = (ad) => {
    if (secilen.length >= o.kapasite || secilen.includes(ad) || zatenGrupta.has(ad) || !programMusaitMi(musaitlik, ad, gunAdi)) return;
    const deneme = programOturumlar.map(x => x.id === oturumId ? { ...x, ogrenciler: secilen } : x);
    if (programCakisiyor(programGunler, deneme, oturumId, ad)) return;
    secilen.push(ad);
  };
  (grp.ogrenciler || []).forEach(s => aday(s.ad));
  mevcut.filter(a => siraAdlari.has(a)).forEach(a => { if (secilen.length < o.kapasite && !secilen.includes(a)) secilen.push(a); });
  (grp.esikUstu || []).forEach(s => aday(s.ad));
  return secilen;
}

// Oturumdaki öğrencinin geliş kaynağı: "esik" = grupta eşik altı, "sirala" = eşik üstü doldurma, null = bu haftanın grubunda yok.
// Saklanmaz, gruptan türetilir → eşik değişince işaret de güncellenir; oturum.ogrenciler ad listesi kalır (Excel/PDF/kural aynı).
function programKaynak(grp, ad) {
  if (!grp) return null;
  if ((grp.ogrenciler || []).some(o => o.ad === ad)) return "esik";
  if ((grp.esikUstu || []).some(o => o.ad === ad)) return "sirala";
  return null;
}

// "+ eklenebilir" sıra listesi: grubun eşik üstü öğrencileri yüzde artan; oturumda olan, aynı grubun başka
// oturumunda olan ve kuralı bozacak olanlar hariç.
function programSiraAdaylari(grp, programGunler, programOturumlar, oturumId, musaitlik) {
  const o = (programOturumlar || []).find(x => x.id === oturumId);
  if (!o || !grp) return [];
  const gunAdi = (programGunler || []).find(g => g.id === o.gunId)?.gunAdi;
  const zatenGrupta = new Set((programOturumlar || [])
    .filter(x => x.id !== oturumId && x.grupKey === o.grupKey)
    .flatMap(x => x.ogrenciler || []));
  return (grp.esikUstu || []).filter(s => !(o.ogrenciler || []).includes(s.ad) && !zatenGrupta.has(s.ad)
    && programMusaitMi(musaitlik, s.ad, gunAdi)
    && !programCakisiyor(programGunler, programOturumlar, oturumId, s.ad));
}

// Program altındaki sıralama listesi: doldurma sırasının aynısı — önce eşik altı (zayıf önce), sonra eşik üstü (yüzde artan);
// her öğrencinin bu grubun programdaki yeri (gün, tarih, saat) ile. Öğretmen kimin neden geldiğini buradan görür.
function programSiraListesi(grp, programGunler, programOturumlar) {
  if (!grp) return [];
  const gun = {};
  (programGunler || []).forEach(g => { gun[g.id] = g; });
  const yerler = (ad) => (programOturumlar || [])
    .filter(o => o.grupKey === grp.key && (o.ogrenciler || []).includes(ad))
    .map(o => ({ oturumId: o.id, gunAdi: gun[o.gunId]?.gunAdi || "", tarih: gun[o.gunId]?.tarih || "", saat: o.saat }));
  return [...(grp.ogrenciler || []).map(s => ({ ...s, kaynak: "esik" })), ...(grp.esikUstu || []).map(s => ({ ...s, kaynak: "sirala" }))]
    .map((s, i) => ({ ...s, sira: i + 1, yerler: yerler(s.ad) }));
}

// Yeni oturumun saati: aynı gün adında henüz kullanılmamış ilk saat (hepsi doluysa ilk saat).
function programBosSaat(programGunler, programOturumlar, gunId) {
  const gun = (programGunler || []).find(g => g.id === gunId);
  const ayniGun = new Set((programGunler || []).filter(g => gun && g.gunAdi === gun.gunAdi).map(g => g.id));
  const dolu = new Set((programOturumlar || []).filter(o => ayniGun.has(o.gunId)).map(o => o.saat));
  return SAATLER.find(s => !dolu.has(s)) || SAATLER[0];
}

//  1) Eşik altı talepler (öğrenci × grup) zayıf önce işlenir → öğrencinin en zayıf dersi kendi öteki derslerinden önce yer bulur.
//  2) Grubun oturumlarına dengeli kota (42 kişi, 5×10 → 9/9/8/8/8); talep kotası dolmamış ilk oturuma girer. Giremezse
//     yer değiştirme zinciri denenir: oturumdaki biri aynı grubun başka oturumuna kayar ya da öğrencinin aynı güne düşen
//     öteki etüdü başka güne taşınır. Yerleşmiş eşik altı öğrenci hiçbir adımda programdan ÇIKARILMAZ.
//  3) Kota çakışma yüzünden yetmezse kapasiteye kadar doldurulur; sonra aynı grubun oturumları arasındaki fark
//     (en dolu − en boş) 1'e inene dek zincirle kaydırılır.
//  4) Kalan boş yerler eşik üstü sıra ile (düşük % önce, ilk boş oturum) dolar — eşik altı sıranın her zaman önündedir.
// Kural @@TAKVIM-KURALI'ndaki slotCakisanlar ile aynı (hafta içi günde 1, aynı gün+saat asla). Bu haftada grubu olmayan
// oturum olduğu gibi kalır ama öğrencileri çakışmada sayılır. Saat/gün değiştirilmez.
function programGunCakisir(a, b) {
  return !!a && !!b && a.gun === b.gun && (a.saat === b.saat || !haftaSonuMu(a.gun));
}

// Toplam min(n, Σkapasite) kişiyi oturumlara tur tur birer birer dağıtır: [10,10,10,10,10], 42 → [9,9,8,8,8].
function programDengeKotasi(kapasiteler, n) {
  const kota = kapasiteler.map(() => 0);
  let kalan = Math.min(n, kapasiteler.reduce((a, c) => a + c, 0));
  while (kalan > 0) {
    for (let i = 0; i < kota.length && kalan > 0; i++) if (kota[i] < kapasiteler[i]) { kota[i]++; kalan--; }
  }
  return kota;
}

function programDengeliAta(groups, programGunler, programOturumlar, musaitlik) {
  const oturumlar = programOturumlar || [];
  const gunAdi = {};
  (programGunler || []).forEach(g => { gunAdi[g.id] = g.gunAdi; });
  const grupMap = {};
  (groups || []).forEach(g => { grupMap[g.key] = g; });
  const slot = {}, oturumById = {};
  oturumlar.forEach(o => { slot[o.id] = { gun: gunAdi[o.gunId], saat: o.saat }; oturumById[o.id] = o; });
  // öğrenci o oturumun gününe gelemiyorsa oturum ona hiç açılmaz (zincirde de)
  const musait = (t, oId) => programMusaitMi(musaitlik, t.ad, slot[oId].gun);
  const sabit = {};  // ad → grubu bu haftada olmayan oturumlar (taşınamaz)
  oturumlar.filter(o => !grupMap[o.grupKey]).forEach(o => (o.ogrenciler || []).forEach(ad => (sabit[ad] = sabit[ad] || []).push(o.id)));
  const grupOturum = {};
  oturumlar.filter(o => grupMap[o.grupKey]).forEach(o => (grupOturum[o.grupKey] = grupOturum[o.grupKey] || []).push(o));

  const talepler = [];
  const talepEkle = (g, liste, tur) => (liste || []).forEach((s, rank) =>
    talepler.push({ id: talepler.length, ad: s.ad, yuzde: s.yuzde ?? 0, grupKey: g.key, tur, rank }));
  (groups || []).forEach(g => { if (grupOturum[g.key]) talepEkle(g, g.ogrenciler, "esik"); });
  (groups || []).forEach(g => { if (grupOturum[g.key]) talepEkle(g, g.esikUstu, "sirala"); });
  const zayifOnce = (liste) => [...liste].sort((a, b) => a.yuzde - b.yuzde || a.id - b.id);
  const esikTalep = zayifOnce(talepler.filter(t => t.tur === "esik"));
  const siraTalep = zayifOnce(talepler.filter(t => t.tur === "sirala"));
  const ogrTalep = {};
  talepler.forEach(t => (ogrTalep[t.ad] = ogrTalep[t.ad] || []).push(t));

  const yer = {}, uyeler = {}, log = [];
  oturumlar.forEach(o => { uyeler[o.id] = []; });
  const koy = (t, hedef) => {
    const eski = yer[t.id];
    if (eski) uyeler[eski] = uyeler[eski].filter(id => id !== t.id);
    if (hedef) { uyeler[hedef].push(t.id); yer[t.id] = hedef; } else delete yer[t.id];
  };
  const tasi = (t, hedef) => { log.push([t, yer[t.id]]); koy(t, hedef); };
  const geriAl = (n) => { while (log.length > n) { const [t, eski] = log.pop(); koy(t, eski); } };
  // t'nin öğrencisinin oId ile çakışan öteki yerleri: taşınabilir talepler + taşınamaz (sabit) oturum var mı
  const engeller = (t, oId) => {
    const tasinir = (ogrTalep[t.ad] || []).filter(u => u.id !== t.id && yer[u.id] && programGunCakisir(slot[yer[u.id]], slot[oId]));
    const sabitVar = (sabit[t.ad] || []).some(id => programGunCakisir(slot[id], slot[oId]));
    return { tasinir, sabitVar };
  };

  let butce = 0;
  // t'yi oId'ye koyar; gerekirse öğrencinin çakışan etüdünü ve oturumun bir üyesini zincirle kaydırır. Başarısızsa her şey geri alınır.
  const yerlestir = (t, oId, limit, ziyaret, derinlik) => {
    if (!musait(t, oId) || --butce < 0 || derinlik > 8) return false;
    const n0 = log.length;
    const e = engeller(t, oId);
    if (e.sabitVar) return false;
    for (const u of e.tasinir) {
      if (!kaydir(u, limit, ziyaret, derinlik + 1, slot[oId])) { geriAl(n0); return false; }
    }
    if (uyeler[oId].length >= limit(oId)) {
      const aday = [...uyeler[oId]].reverse().map(id => talepler[id]);
      if (!aday.some(u => kaydir(u, limit, ziyaret, derinlik + 1, null))) { geriAl(n0); return false; }
    }
    const son = engeller(t, oId);
    if (son.sabitVar || son.tasinir.length > 0 || uyeler[oId].length >= limit(oId)) { geriAl(n0); return false; }
    tasi(t, oId);
    return true;
  };
  // u'yu aynı grubun başka oturumuna taşır (kacin: öğrencinin boşaltması gereken gün/saat).
  const kaydir = (u, limit, ziyaret, derinlik, kacin) => {
    for (const o of grupOturum[u.grupKey]) {
      if (o.id === yer[u.id] || ziyaret.has(o.id) || (kacin && programGunCakisir(slot[o.id], kacin))) continue;
      ziyaret.add(o.id);
      if (yerlestir(u, o.id, limit, ziyaret, derinlik)) return true;
    }
    return false;
  };
  const dogrudanGirer = (t, oId, limit) => {
    if (!musait(t, oId) || uyeler[oId].length >= limit(oId)) return false;
    const e = engeller(t, oId);
    return !e.sabitVar && e.tasinir.length === 0;
  };
  const dene = (t, limit, zincir = true) => {
    const liste = grupOturum[t.grupKey];
    const dogrudan = liste.find(o => dogrudanGirer(t, o.id, limit));
    if (dogrudan) { tasi(t, dogrudan.id); return true; }
    if (!zincir) return false;
    const ziyaret = new Set();
    for (const o of liste) {
      ziyaret.add(o.id);
      butce = 4000;
      if (yerlestir(t, o.id, limit, ziyaret, 0)) return true;
    }
    return false;
  };

  // 1–2) dengeli kota, sonra kapasite
  const kota = {};
  Object.values(grupOturum).forEach(liste => {
    const k = programDengeKotasi(liste.map(o => o.kapasite), (grupMap[liste[0].grupKey].ogrenciler || []).length);
    liste.forEach((o, i) => { kota[o.id] = k[i]; });
  });
  const kapasite = (id) => oturumById[id].kapasite;
  esikTalep.forEach(t => dene(t, (id) => Math.min(kota[id] ?? 0, kapasite(id))));
  esikTalep.forEach(t => { if (!yer[t.id]) dene(t, kapasite); });

  // 3) aynı grubun oturumları arasında fark ≤ 1 (yalnız eşik altı sayılır; sıra henüz yok)
  Object.values(grupOturum).forEach(liste => {
    for (let tur = 0; tur < 500 && liste.length > 1; tur++) {
      const say = {};
      oturumlar.forEach(o => { say[o.id] = uyeler[o.id].length; });
      const enCok = Math.max(...liste.map(o => say[o.id]));
      const kaynaklar = liste.filter(o => say[o.id] === enCok);
      const hedefler = liste.filter(o => say[o.id] <= enCok - 2 && say[o.id] < o.kapasite).sort((a, b) => say[a.id] - say[b.id]);
      let oldu = false;
      for (const h of hedefler) {
        const limit = (id) => id === h.id ? say[id] + 1 : Math.min(say[id], kapasite(id));
        for (const k of kaynaklar) {
          for (const u of [...uyeler[k.id]].reverse().map(id => talepler[id])) {
            const n0 = log.length;
            const ziyaret = new Set([k.id]);
            butce = 2000;
            if (kaydir(u, limit, ziyaret, 0, null) && uyeler[k.id].length === enCok - 1) { oldu = true; break; }
            geriAl(n0);
          }
          if (oldu) break;
        }
        if (oldu) break;
      }
      if (!oldu) break;
    }
  });

  // 4) sıra: boş yerler, zincir yok (eşik altı yerinden oynamaz)
  siraTalep.forEach(t => dene(t, kapasite, false));

  return oturumlar.map(o => {
    if (!grupMap[o.grupKey]) return o;
    const sirali = uyeler[o.id].map(id => talepler[id])
      .sort((a, b) => (a.tur === b.tur ? 0 : a.tur === "esik" ? -1 : 1) || a.rank - b.rank);
    return { ...o, ogrenciler: sirali.map(t => t.ad) };
  });
}

// Programdaki her grup için şu anki durumun raporu (manuel değişiklikler dahil): eşik altı kaç, kaç yerleşti,
// gün gün dağılım, yerleşemeyen her öğrenci ve nedeni. tur: "kapasite" (grubun bütün oturumları eşik altıyla dolu) |
// "cakisma" (boş yer olan her oturumun gününde öğrencinin başka etüdü var) | "bos" (yer var, henüz atanmadı) |
// "musait" (grubun hiçbir oturum gününe gelemiyor). Müsait olmayan günler yalnız müsait günlerle birlikte bakılır;
// kapasite/çakışma metnine "müsait değil (gün)" eklenir. Müsait olmadığı güne yazılmış öğrenci `musaitIhlal` listesinde.
function programDengeRaporu(groups, programGunler, programOturumlar, musaitlik) {
  const oturumlar = programOturumlar || [];
  const gun = {};
  (programGunler || []).forEach(g => { gun[g.id] = g; });
  const slotOf = (o) => ({ gun: gun[o.gunId]?.gunAdi, saat: o.saat });
  return (groups || []).filter(g => oturumlar.some(o => o.grupKey === g.key)).map(g => {
    const liste = oturumlar.filter(o => o.grupKey === g.key);
    const esikAd = new Set((g.ogrenciler || []).map(s => s.ad));
    const siraAd = new Set((g.esikUstu || []).map(s => s.ad));
    const dagilim = liste.map(o => ({
      oturumId: o.id, gunAdi: gun[o.gunId]?.gunAdi || "", saat: o.saat, kapasite: o.kapasite,
      esik: (o.ogrenciler || []).filter(a => esikAd.has(a)).length,
      sira: (o.ogrenciler || []).filter(a => siraAd.has(a)).length,
    }));
    const programda = new Set(liste.flatMap(o => o.ogrenciler || []));
    const yerlesemeyen = (g.ogrenciler || []).filter(s => !programda.has(s.ad)).map(s => {
      const cakisanlar = [];
      let bosVar = false, cakismaVar = false;
      const kapaliGunler = [...new Set(liste.map(o => gun[o.gunId]?.gunAdi).filter(gn => gn && !programMusaitMi(musaitlik, s.ad, gn)))];
      const musaitNot = kapaliGunler.length ? `müsait değil (${kapaliGunler.join(", ")})` : "";
      if (liste.every(o => !programMusaitMi(musaitlik, s.ad, gun[o.gunId]?.gunAdi))) {
        return { ad: s.ad, yuzde: s.yuzde, tur: "musait", metin: musaitNot, cakisanlar, kapaliGunler };
      }
      liste.forEach((o, i) => {
        if (!programMusaitMi(musaitlik, s.ad, gun[o.gunId]?.gunAdi)) return;
        if (dagilim[i].esik >= o.kapasite) return;
        const engel = oturumlar.filter(x => x.id !== o.id && (x.ogrenciler || []).includes(s.ad) && programGunCakisir(slotOf(x), slotOf(o)));
        if (engel.length === 0) { bosVar = true; return; }
        cakismaVar = true;
        engel.forEach(x => {
          const m = `${gun[o.gunId]?.gunAdi || ""} ${o.saat} → ${gun[x.gunId]?.gunAdi || ""} ${x.saat} ${x.ders} - ${x.konu}`;
          if (!cakisanlar.includes(m)) cakisanlar.push(m);
        });
      });
      const tur = bosVar ? "bos" : cakismaVar ? "cakisma" : "kapasite";
      const metin = (tur === "kapasite" ? `kapasite dolu (${liste.length} oturum, toplam ${liste.reduce((a, o) => a + o.kapasite, 0)} yer)`
        : tur === "cakisma" ? `çakışma: ${cakisanlar.join(" · ")}`
        : "boş yer var — ⚖️ Haftayı Dengeli Ata ile yerleşir") + (musaitNot ? ` · ${musaitNot}` : "");
      return { ad: s.ad, yuzde: s.yuzde, tur, metin, cakisanlar, kapaliGunler };
    });
    // öğretmenin elle ya da eski programla gelemediği güne yazılmış öğrenciler (eşik altı + sıra)
    const musaitIhlal = liste.flatMap(o => (o.ogrenciler || [])
      .filter(ad => !programMusaitMi(musaitlik, ad, gun[o.gunId]?.gunAdi))
      .map(ad => ({ ad, oturumId: o.id, gunAdi: gun[o.gunId]?.gunAdi || "", saat: o.saat })));
    // denge farkı: en dolu oturum − yeri olan en boş oturum (kapasite yüzünden az kalan oturum dengesizlik sayılmaz)
    const yeriOlan = dagilim.filter(d => d.esik < d.kapasite).map(d => d.esik);
    const esikSay = dagilim.map(d => d.esik);
    return {
      grupKey: g.key, ders: g.ders, konu: g.konu, esikAlti: (g.ogrenciler || []).length,
      yerlesen: (g.ogrenciler || []).length - yerlesemeyen.length,
      sira: dagilim.reduce((a, d) => a + d.sira, 0),
      toplamKapasite: liste.reduce((a, o) => a + o.kapasite, 0),
      cakisma: yerlesemeyen.filter(y => y.tur === "cakisma").length,
      kapasiteDisi: yerlesemeyen.filter(y => y.tur === "kapasite").length,
      bosta: yerlesemeyen.filter(y => y.tur === "bos").length,
      musaitDisi: yerlesemeyen.filter(y => y.tur === "musait").length, musaitIhlal,
      dagilim, fark: yeriOlan.length && esikSay.length ? Math.max(0, Math.max(...esikSay) - Math.min(...yeriOlan)) : 0, yerlesemeyen,
    };
  });
}

// 1509-p0p1 (kullanıcı 15.09): haftalık özet — salt okunur sayım, atamayı değiştirmez.
// deneme = denemeye giren öğrenci (bu haftanın öğrenci listesindeki farklı ad); yazilan = programda en az 1 oturumda adı geçen;
// gelmeyen = deneme − yazilan (bu hafta hiç etüt oturumu yok); etut = öğrencinin bu haftaki oturum sayısı;
// esikAltiGrup = öğrencinin eşik altında olduğu etüt grubu sayısı; esikAltiYazilmadi = eşik altı grubu var ama 0 etüt.
// 1509-ozet-esikdisi (kullanıcı 16.09): "eşik altı ama yazılmayan" AYRI sayı — "gelmeyecek"in yerini almaz.
// esikAltiYazilmayan = en az bir eşik altı grubunda olup programda HİÇ oturumu olmayan (= esikAltiYazilmadi, açık ad).
//   Bu sayı "neden yazılmadı" ayırmaz: kapasite dolu, takvim/müsaitlik çakışması ve o dersin hiç oturumu açılmamış olması hepsi buraya girer.
// talepAcik = en az bir eşik altı grubu programda karşılanmamış öğrenci (başka derste oturumu olsa bile) ⊇ esikAltiYazilmayan.
function programHaftaOzeti(ogrenciAdlari, groups, programGunler, programOturumlar) {
  const gunSira = {};
  (programGunler || []).forEach((g, i) => { gunSira[g.id] = { i, gunAdi: g.gunAdi }; });
  const adlar = [...new Set((ogrenciAdlari || []).filter(Boolean))];
  const oturumlar = [...(programOturumlar || [])].sort((a, b) =>
    (gunSira[a.gunId]?.i ?? 99) - (gunSira[b.gunId]?.i ?? 99) || String(a.saat).localeCompare(String(b.saat)));
  const esikGrup = {};
  (groups || []).forEach(g => (g.ogrenciler || []).forEach(s => {
    (esikGrup[s.ad] = esikGrup[s.ad] || []).push({ key: g.key, ders: g.ders, konu: g.konu, yuzde: s.yuzde });
  }));
  const ogrenciler = adlar.map(ad => {
    const ot = oturumlar.filter(o => (o.ogrenciler || []).includes(ad));
    const zayif = esikGrup[ad] || [];
    const yazilanKey = new Set(ot.map(o => o.grupKey));
    return { ad, etut: ot.length, esikAltiGrup: zayif.length, zayifGruplar: zayif,
      yazilmayanGruplar: zayif.filter(z => !yazilanKey.has(z.key)),
      oturumlar: ot.map(o => ({ oturumId: o.id, grupKey: o.grupKey, gunAdi: gunSira[o.gunId]?.gunAdi || "", saat: o.saat, ders: o.ders, konu: o.konu })) };
  });
  const yazilan = ogrenciler.filter(o => o.etut > 0).length;
  const esikAltiYazilmayanListe = ogrenciler.filter(o => o.etut === 0 && o.esikAltiGrup > 0);
  const talepAcikListe = ogrenciler.filter(o => o.yazilmayanGruplar.length > 0);
  return {
    deneme: adlar.length, yazilan, gelmeyen: adlar.length - yazilan,
    toplamEtut: ogrenciler.reduce((t, o) => t + o.etut, 0),
    esikAltiYazilmadi: esikAltiYazilmayanListe.length,
    esikAltiYazilmayan: esikAltiYazilmayanListe.length, esikAltiYazilmayanListe,
    talepAcik: talepAcikListe.length, talepAcikListe,
    ogrenciler,
  };
}

// Program öğrenci çipinin kısa gerekçesi (1509-p0p1): yalnız grubun kaydındaki yüzde ve (birleşikte) konu konu `detay`; konu adı uydurulmaz.
// Eşik altı → "Etüt nedeni: YAZMA %0 + OKUMA %50 → TÜRKÇE birleşik %36 < eşik %50"; sıra → "Sıra: … ≥ eşik %50 — boş kontenjan".
function programGerekce(grp, ad, esik) {
  if (!grp) return "";
  const esikAlti = (grp.ogrenciler || []).find(s => s.ad === ad);
  const o = esikAlti || (grp.esikUstu || []).find(x => x.ad === ad);
  if (!o) return "";
  const hedef = o.detay && o.detay.length
    ? `${birlesikDetayMetni(o.detay, " + ")} → ${grp.ders} birleşik %${o.yuzde} (${birlesikOrtEtiketi(o)})`
    : `${grp.ders} - ${grp.konu} %${o.yuzde}`;
  const esikMetni = esik === undefined || esik === null ? "" : ` genel aralık %${GENEL_ARALIK.min}–${esik - 1}`;
  return esikAlti ? `Etüt nedeni: ${hedef}${esikMetni ? " ∈" + esikMetni : ""}` : `Sıra: ${hedef}${esikMetni ? " — aralık üstü (" + esikMetni.trim() + ")" : ""} — boş kontenjan`;
}

// Oturum Hazırlık kartı (1609-hazirlik, salt okunur): öğretmen oturuma girmeden önce kimin hangi konuda zayıf olduğunu görür.
// Kaynak yalnız öğrencinin yüklenen karne satırları (konu / alt başlık / kazanım adları veriden, uydurma yok) + grubun kaydı (yuzde, detay).
// Zayıf = yuzde < esik (buildGroupsNow ile aynı eşik; yeni eşik yok). Grubun üye konuları: birleşikse konuGruplari[grp.key].konular,
// değilse grp.key'in kendisi (normKey biçimi "DERS|||KONU"). Hiçbir durum değiştirilmez; oturum ve gruplar yalnız okunur.
// Dönüş: { ogrenciler:[{ ad, kaynak, grupYuzde, agirlik, detay, veriYok, konular:[{ konu, yuzde, soru, zayif, alt:[{ tur, ad, yuzde, ust }] }] }],
//          ortakKonular:[{ konu, sayi, ort, ogrenciler }], ortakAlt:[{ tur, ad, konu, sayi, ogrenciler }] }
function programHazirlik(oturum, grp, ogrenciKayitlari, konuGruplari, esik) {
  const anahtar = (d, k) => String(d || "").trim().toLocaleUpperCase("tr-TR") + "|||" + String(k || "").trim().toLocaleUpperCase("tr-TR");
  const birlesik = grp && konuGruplari && konuGruplari[grp.key];
  const uyeAnahtar = new Set(birlesik
    ? (birlesik.konular || []).map(rk => { const p = String(rk).split("|||"); return anahtar(p[0], p[1]); })
    : grp ? [grp.key] : oturum ? [anahtar(oturum.ders, oturum.konu)] : []);
  const zayifMi = (y) => y !== null && y !== undefined && Number.isFinite(Number(y)) && Number(y) < esik;
  const kayitBul = (ad) => (ogrenciKayitlari || []).find(s => s && s.ogrenci === ad);
  const ogrenciler = ((oturum && oturum.ogrenciler) || []).map(ad => {
    const kaynak = programKaynak(grp, ad);
    const g = grp && ((grp.ogrenciler || []).find(s => s.ad === ad) || (grp.esikUstu || []).find(s => s.ad === ad));
    const satirlar = ((kayitBul(ad) || {}).konular || []).filter(k => k && uyeAnahtar.has(anahtar(k.ders, k.konu)));

// @@GENEL-ARALIK-BASLA
// 2010-genel-aralik (kullanıcı 20.10): üst çubuktaki genel "Eşik %X" kaydırıcısı yerine genel ARALIK [min, max] (ikisi dahil).
// Varsayılan 0 – (eski eşik varsayılanı 50) − 1 = 0–49 → eski "eşik altı" davranışı BİREBİR (yüzdeler yuvarlanmış tam sayı).
// İç uyum: eski kodun `threshold` değişkeni = max + 1 olarak TÜRETİLİR; böylece "y < threshold" ⇔ "y ≤ max" ve program motoru
// (programDengeliAta, rapor, özet) hiç değişmez. Alt sınır yalnız gruba alım / zayıf konu / sayımlarda uygulanır:
//   • min = 0  → eski eşik gibi: aralıktakiler grupta, üstündekiler `esikUstu` (sıra) ile boş kontenjanı doldurmaya DEVAM eder.
//   • min > 0  → aralık dışı doldurma YOK (esikUstu boş); min altı öğrenci de gruba girmez — @@ARALIK-MODU grup aralığıyla tutarlı.
// Kalıcı: localStorage GENEL_ARALIK_STORAGE_KEY. Eski sürümde eşik kaydedilmiyordu; yine de ATAYURT_ESIK bulunursa 0–(eşik−1) göç edilir.
const GENEL_ARALIK_STORAGE_KEY = "ATAYURT_GENEL_ARALIK";
const GENEL_ARALIK_VARSAYILAN = { min: 0, max: 49 };
let GENEL_ARALIK = { ...GENEL_ARALIK_VARSAYILAN }; // her render'da bileşen günceller (export/gerekçe metinleri için)
function genelAralikOku() {
  try {
    const ls = window.localStorage;
    const k = JSON.parse(ls.getItem(GENEL_ARALIK_STORAGE_KEY) || "null");
    if (k && aralikDogrula(k.min, k.max) === null) return { min: Number(k.min), max: Number(k.max) };
    const eski = Number(ls.getItem("ATAYURT_ESIK"));
    if (ls.getItem("ATAYURT_ESIK") !== null && Number.isFinite(eski) && eski > 0) return { min: 0, max: Math.min(100, eski - 1) };
  } catch (e) {}
  return { ...GENEL_ARALIK_VARSAYILAN };
}
function genelAralikMetni(a) { const x = a || GENEL_ARALIK; return `%${x.min}–${x.max}`; }
function genelAraliktaMi(y, a) { const x = a || GENEL_ARALIK; return y !== null && y !== undefined && Number(y) >= x.min && Number(y) <= x.max; }
// @@GENEL-ARALIK-BITIR

// @@ARALIK-MODU-BASLA
// 0810-aralik (kullanıcı 08.10): etüt grubu başına "Aralık" modu. Varsayılan "Eşik altı" — mevcut davranış BİREBİR.
// Aralık [min, max] (ikisi de dahil): yalnız birleşik yüzdesi (buildGroupsNow'daki `birlesikYuzde`, soru ağırlıklı 100·Σdoğru/Σsoru,
// yuvarlanmış) aralıkta olan öğrenciler gruba girer; aralık içinde zayıf önce; esikUstu BOŞ → aralık dışına (yukarı) doldurma YOK.
// Program motoru (programDengeliAta / rapor / özet) DEĞİŞMEDİ: aralık grubunun `ogrenciler`i motor için ana talep listesidir,
// kapasite / günlük limit / saat çakışması / dengeli dağılım aynen uygulanır, sığmayan "kapasite dışı" raporuna düşer.
// Ayar: { modlar: { [grupKey]: { min, max } }  → mevcut grubun modu Aralık (eşik yerine),
//         ekler:  [{ id, kaynakKey, min, max }] → aynı konu için EK aralık grubu (ör. 50–70 yanında 70–90). }
// Kayıt yok / bozuk kayıt → Eşik altı (eski veri). Ayar eşik gibi oturum (React state) ömürlüdür: eşik gibi yeni hafta yüklenince de
// korunur (aynı konu anahtarı yeni haftada aynı aralığı alır); sayfa yenilenince eşikle birlikte sıfırlanır.
function aralikDogrula(min, max) {
  const a = Number(min), b = Number(max);
  if (min === "" || max === "" || min === null || max === null || !Number.isFinite(a) || !Number.isFinite(b)) return "Alt ve üst sınır sayı olmalı.";
  if (a < 0 || b > 100) return "Sınırlar 0 ile 100 arasında olmalı.";
  if (a >= b) return "Alt sınır üst sınırdan küçük olmalı.";
  return null;
}
function aralikAyarTemizle(ayar) {
  const temiz = { modlar: {}, ekler: [] };
  if (!ayar || typeof ayar !== "object") return temiz;
  Object.entries(ayar.modlar && typeof ayar.modlar === "object" ? ayar.modlar : {}).forEach(([k, v]) => {
    if (v && aralikDogrula(v.min, v.max) === null) temiz.modlar[k] = { min: Number(v.min), max: Number(v.max) };
  });
  (Array.isArray(ayar.ekler) ? ayar.ekler : []).forEach(e => {
    if (e && e.id !== undefined && e.id !== null && e.kaynakKey && aralikDogrula(e.min, e.max) === null)
      temiz.ekler.push({ id: String(e.id), kaynakKey: String(e.kaynakKey), min: Number(e.min), max: Number(e.max) });
  });
  return temiz;
}
function aralikEtiketi(a) { return a ? `Aralık ${a.min}–${a.max}` : ""; }
function aralikGrupKey(kaynakKey, id) { return `${kaynakKey}##ARALIK#${id}`; }
// esikGruplari: buildGroupsNow'un eşik çıktısı (sıralı). tum: { [grupKey]: { ders, konu, altKonular, kayitlar:[{ad, yuzde, ...}] } } —
// grubun TÜM öğrencileri (eşik altı + üstü). Ayar boşsa esikGruplari AYNEN (aynı dizi) döner.
function aralikGruplariUygula(esikGruplari, tum, ayar) {
  const a = aralikAyarTemizle(ayar);
  if (Object.keys(a.modlar).length === 0 && a.ekler.length === 0) return esikGruplari;
  const zayifOnce = (x, y) => x.yuzde - y.yuzde || String(x.ad).localeCompare(String(y.ad), "tr");
  const kur = (key, kaynakKey, aralik) => {
    const v = (tum || {})[kaynakKey];
    if (!v) return null;
    const ogrenciler = (v.kayitlar || []).filter(k => k.yuzde >= aralik.min && k.yuzde <= aralik.max).sort(zayifOnce);
    return { key, ders: v.ders, konu: v.konu, altKonular: v.altKonular, ogrenciler, esikUstu: [],
      aralik: { min: aralik.min, max: aralik.max, kaynakKey, ek: key !== kaynakKey, id: aralik.id },
      ortalama: ogrenciler.length ? Math.round(ogrenciler.reduce((t, o) => t + o.yuzde, 0) / ogrenciler.length) : null };
  };
  const sonuc = (esikGruplari || []).filter(g => !a.modlar[g.key]);
  Object.entries(a.modlar).forEach(([k, ar]) => { const g = kur(k, k, ar); if (g) sonuc.push(g); });
  a.ekler.forEach(e => { const g = kur(aralikGrupKey(e.kaynakKey, e.id), e.kaynakKey, e); if (g) sonuc.push(g); });
  // eşik gruplarıyla AYNI sıralama (stabil sıralama → eşik gruplarının kendi sırası korunur); boş aralık grubu sonda
  return sonuc.sort((x, y) => (x.ortalama ?? 101) - (y.ortalama ?? 101) || y.ogrenciler.length - x.ogrenciler.length);
}
// Çip gerekçesi: aralık grubunda "Etüt nedeni: Aralık 50–70: MATEMATİK - Kesirler %62"; eşik grubunda programGerekce aynen.
function aralikGerekce(grp, ad) {
  if (!grp || !grp.aralik) return "";
  const o = (grp.ogrenciler || []).find(s => s.ad === ad);
  if (!o) return "";
  const hedef = o.detay && o.detay.length
    ? `${birlesikDetayMetni(o.detay, " + ")} → ${grp.ders} birleşik %${o.yuzde} (${birlesikOrtEtiketi(o)})`
    : `${grp.ders} - ${grp.konu} %${o.yuzde}`;
  return `Etüt nedeni: ${aralikEtiketi(grp.aralik)}: ${hedef}`;
}
function grupGerekce(grp, ad, esik) { return grp && grp.aralik ? aralikGerekce(grp, ad) : programGerekce(grp, ad, esik); }
// Hazırlık kartı: ek aralık grubunun anahtarı konu anahtarı değildir → üye konular kaynak gruptan okunur.
// Zayıf işareti aralık grubunda "üst sınır ve altı" (eşik grubunda eşik altı, değişmedi).
function aralikHazirlikGrubu(grp) { return grp && grp.aralik ? { ...grp, key: grp.aralik.kaynakKey } : grp; }
function aralikHazirlikEsik(grp, esik) { return grp && grp.aralik ? grp.aralik.max + 1e-9 : esik; }

// @@ELLE-EKLE-BASLA
// 2010-elle (kullanıcı 20.10): öğretmen bir oturuma ELLE (ad yazarak) öğrenci ekler; karnede olmayan serbest isim de olur.
// oturum.elle = [ad] (oturum nesnesinde; program state'i neredeyse oraya kalıcıdır). Elle eklenenler KİLİTLİ: motor
// (programDengeliAta) DEĞİŞMEDİ — sarmalayıcı motoru elle adlar çıkarılmış ve kapasitesi elle sayısı kadar düşürülmüş
// oturumlarla çağırır, sonra elle adları geri ekler. Kapasite/müsaitlik/çakışma yalnız UYARI (öğretmen karar verir).
function programElleKoruyarak(groups, programGunler, programOturumlar, musaitlik) {
  const liste = programOturumlar || [];
  const elleOf = (o) => Array.isArray(o.elle) ? o.elle : [];
  if (!liste.some(o => elleOf(o).length)) return programDengeliAta(groups, programGunler, liste, musaitlik);
  const giris = liste.map(o => { const e = elleOf(o); return e.length ? { ...o, kapasite: Math.max(0, o.kapasite - e.length), ogrenciler: (o.ogrenciler || []).filter(a => !e.includes(a)) } : o; });
  const kaynak = {}; liste.forEach(o => { kaynak[o.id] = o; });
  return programDengeliAta(groups, programGunler, giris, musaitlik).map(o => {
    const src = kaynak[o.id]; const e = src ? elleOf(src) : [];
    if (!e.length) return o;
    return { ...o, kapasite: src.kapasite, elle: e, ogrenciler: [...(o.ogrenciler || []).filter(a => !e.includes(a)), ...e] };
  });
}
function elleAramaAnahtari(s) {
  return String(s || "").toLocaleLowerCase("tr-TR").replace(/[çğıöşüâîû]/g, c => ({ "ç": "c", "ğ": "g", "ı": "i", "ö": "o", "ş": "s", "ü": "u", "â": "a", "î": "i", "û": "u" }[c])).replace(/\s+/g, " ").trim();
}
function elleEtiket(o, ad) { return Array.isArray(o && o.elle) && o.elle.includes(ad) ? " (Elle eklendi)" : ""; }
// @@ELLE-EKLE-BITIR

// @@PROGRAM-KAYIT-BASLA
// 2010-kayit (kullanıcı 20.10): program (günler + oturumlar: saat, hoca, kapasite, öğrenciler, elle) localStorage'a otomatik yazılır.
// Anahtar = hafta etiketi + öğrenci listesinin kısa hash'i → aynı karne/hafta tekrar yüklenince bulunur. Geri yükleme OTOMATİK DEĞİL:
// "Kayıtlı program bulundu — Yükle / Yok say" şeridi çıkar (öğretmenin o an kurduğu programı habersiz ezmemek için daha güvenli).
// Şerit açıkken ve program boşken otomatik kayıt YAZMAZ (kayıtlı program boş programla ezilmez). Motor/akış değişmez; tüm
// localStorage/JSON işlemleri try/catch içinde — hata yalnız göstergede görünür, uygulama çökmez.
const PROGRAM_KAYIT_ONEK = "ATAYURT_PROGRAM::";
const PROGRAM_KAYIT_SURUM = 1;
const PROGRAM_DOSYA_TUR = "atayurt-etut-program";
function programKayitHash(adlar) {
  const t = [...(adlar || [])].map(a => String(a)).sort().join("|");
  let h = 5381; for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function programKayitAnahtari(weekLabel, adlar) { return (adlar && adlar.length) ? `${PROGRAM_KAYIT_ONEK}${weekLabel || ""}::${programKayitHash(adlar)}` : ""; }
// Dosya/kayıt doğrulama: hata metni ya da { programGunler, programOturumlar }.
function programKayitDogrula(v) {
  if (!v || typeof v !== "object") return "Dosya bir program kaydı değil.";
  if (v.tur !== PROGRAM_DOSYA_TUR) return "Bu dosya Atayurt etüt programı dosyası değil.";
  if (typeof v.surum !== "number" || v.surum > PROGRAM_KAYIT_SURUM) return "Dosya sürümü desteklenmiyor (daha yeni bir sürümle kaydedilmiş olabilir).";
  if (!Array.isArray(v.programGunler) || !Array.isArray(v.programOturumlar)) return "Dosyada gün/oturum listesi yok.";
  if (!v.programGunler.every(g => g && g.id !== undefined && typeof g.gunAdi === "string")) return "Gün kayıtları bozuk.";

    return "Oturum kayıtları bozuk (gün, kapasite ya da öğrenci listesi eksik).";
  return { programGunler: v.programGunler, programOturumlar: v.programOturumlar.map(o => ({ ...o, kapasite: Number(o.kapasite), ogrenciler: o.ogrenciler.map(String), elle: Array.isArray(o.elle) ? o.elle.map(String) : [] })) };
}
function programKayitPaket(weekLabel, anahtar, programGunler, programOturumlar) {
  return { tur: PROGRAM_DOSYA_TUR, surum: PROGRAM_KAYIT_SURUM, anahtar, weekLabel, kaydedildi: new Date().toISOString(), programGunler, programOturumlar };
}
// @@PROGRAM-KAYIT-BITIR

// ─── Program çıktıları (v15 exportProgramExcel / printProgramPDF + saat sütunu) ──
function programSirali(programGunler, programOturumlar) {
  return (programGunler || []).map(gun => ({
    gun,
    oturumlar: (programOturumlar || []).filter(o => o.gunId === gun.id)
      .sort((a, b) => String(a.saat).localeCompare(String(b.saat)) || a.sira - b.sira)
  }));
}

function exportProgramExcel(programGunler, programOturumlar, weekLabel) {
  const XLSX = window.XLSX;
  if (!XLSX) { alert("SheetJS yükleniyor, lütfen bekleyin..."); return; }
  const gunler = programSirali(programGunler, programOturumlar).filter(x => x.oturumlar.length > 0);
  if (gunler.length === 0) { alert("Program boş — önce günlere etüt ekleyin."); return; }
  const wb = XLSX.utils.book_new();
  const ozet = [["Gün", "Tarih", "Saat", "Ders/Grup", "Hoca", "Kapasite", "Öğrenci Sayısı", "Öğrenciler"]];
  const sayfaAdlari = {};
  gunler.forEach(({ gun, oturumlar }, i) => {
    const rows = [[gun.gunAdi + (gun.tarih ? " " + gun.tarih : "")], ["Saat", "Ders/Grup", "Hoca", "Kapasite", "Öğrenci Sayısı", "Öğrenciler"]];
    oturumlar.forEach(o => {
      const label = o.ders + (o.konu ? " - " + o.konu : "");
      rows.push([o.saat || "", label, o.hoca || "-", o.kapasite, o.ogrenciler.length, o.ogrenciler.map(ad => ad + elleEtiket(o, ad)).join(", ")]);
      o.ogrenciler.forEach((ad, j) => rows.push(["", "", "", "", (j + 1) + ". " + ad + elleEtiket(o, ad), ""]));
      rows.push([]);
      ozet.push([gun.gunAdi, gun.tarih || "", o.saat || "", label, o.hoca || "-", o.kapasite, o.ogrenciler.length, o.ogrenciler.map(ad => ad + elleEtiket(o, ad)).join(", ")]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 8 }, { wch: 30 }, { wch: 18 }, { wch: 10 }, { wch: 22 }, { wch: 60 }];
    // Sayfa adı benzersiz olmalı (iki "Pazartesi" kartı olabilir)
    let ad = (gun.gunAdi || "Gün " + (i + 1)).substring(0, 25);
    sayfaAdlari[ad] = (sayfaAdlari[ad] || 0) + 1;
    if (sayfaAdlari[ad] > 1) ad = ad + " " + sayfaAdlari[ad];
    XLSX.utils.book_append_sheet(wb, ws, ad);
  });
  const wsOzet = XLSX.utils.aoa_to_sheet(ozet);
  wsOzet["!cols"] = [{ wch: 12 }, { wch: 8 }, { wch: 8 }, { wch: 30 }, { wch: 18 }, { wch: 10 }, { wch: 12 }, { wch: 70 }];
  XLSX.utils.book_append_sheet(wb, wsOzet, "Özet");
  XLSX.writeFile(wb, `etut-programi-${weekLabel || "hafta"}.xlsx`);
}

function printProgramPDF(programGunler, programOturumlar, weekLabel) {
  const gunler = programSirali(programGunler, programOturumlar).filter(x => x.oturumlar.length > 0);
  if (gunler.length === 0) { alert("Program boş — önce günlere etüt ekleyin."); return; }
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = "body{font-family:Arial,sans-serif;font-size:11px;margin:15px;color:#111}"
    + "h1{font-size:14px;margin:0 0 4px;color:#1e3a5f}h2{font-size:12px;margin:14px 0 4px;color:#1e3a5f;border-bottom:1px solid #8b1e3f;padding-bottom:3px}"
    + "table{border-collapse:collapse;width:100%;margin-bottom:10px;font-size:10px}"
    + "th{background:#e2e8f0;border:1px solid #94a3b8;padding:5px 7px;text-align:left;font-weight:700}"
    + "td{border:1px solid #ddd;padding:4px 7px;vertical-align:top}.ogr{font-size:9px;color:#374151}"
    + "@media print{@page{margin:10mm}}";
  let html = `<html><head><meta charset="utf-8"><title>Etüt Programı</title><style>${css}</style></head><body>`;
  html += `<h1>Özel Atayurt Okulları — Haftalık Etüt Programı</h1>`;
  html += `<p style="margin:2px 0;font-size:10px;color:#6b7280">Hafta: ${esc(weekLabel)} · Tarih: ${new Date().toLocaleDateString("tr-TR")}</p>`;
  gunler.forEach(({ gun, oturumlar }) => {
    html += `<h2>${esc(gun.gunAdi)}${gun.tarih ? " — " + esc(gun.tarih) : ""}</h2>`;
    html += `<table><tr><th style="width:7%">Saat</th><th style="width:27%">Ders / Grup</th><th style="width:15%">Hoca</th><th style="width:6%">Kap.</th><th>Öğrenciler</th><th style="width:70px">İmza</th></tr>`;
    oturumlar.forEach(o => {
      const label = o.ders + (o.konu ? " - " + o.konu : "");
      const ogr = o.ogrenciler.map((ad, i) => (i + 1) + ". " + esc(ad + elleEtiket(o, ad))).join("<br>");
      html += `<tr><td>${esc(o.saat)}</td><td><b>${esc(label)}</b></td><td>${esc(o.hoca || "-")}</td><td style="text-align:center">${o.kapasite}</td><td class="ogr">${ogr || "-"}</td><td></td></tr>`;
    });
    html += `</table>`;
  });
  html += `</body></html>`;
  const w = window.open("", "_blank", "width=900,height=700");
  if (!w) { alert("Açılır pencere engellendi — bu sayfa için açılır pencerelere izin verin."); return; }
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 600);
}

// @@HAFTA-ETIKET (1809-hafta-ux) ────────────────────────────────────────────────
// "+ Yeni hafta" düğmesinin ürettiği etiket. SAF fonksiyon: yalnız etiket üretir,
// hafta verisine / karşılaştırma motoruna dokunmaz.
// Kural: mevcut "Hafta N" etiketlerinin en büyüğünden sonraki numara; hiç "Hafta N"
// yoksa hafta sayısından devam eder. Üretilen etiket mevcut bir etiketle çakışmaz.
function sonrakiHaftaEtiketi(labels) {
  const mevcut = (labels || []).map(l => String(l == null ? '' : l).trim());
  let n = 0;
  mevcut.forEach(l => {
    const m = /^Hafta\s+(\d+)$/i.exec(l);
    if (m) n = Math.max(n, parseInt(m[1], 10));
  });
  if (n === 0) n = mevcut.length; // "Hafta N" biçiminde etiket yoksa sıradaki sayıdan devam
  let aday = `Hafta ${n + 1}`;
  while (mevcut.includes(aday)) { n += 1; aday = `Hafta ${n + 1}`; }
  return aday;
}

  const musaitTaban = useMemo(() => { const m = {}; Object.entries(musaitEslesme).forEach(([k, e]) => { if (e.kapali && e.kapali.length) m[k] = e.kapali; }); return m; }, [musaitEslesme]);
  const ogrMusait = useMemo(() => { const m = {...musaitTaban}; Object.entries(ogrMusaitFark).forEach(([k, v]) => { if (v.length) m[k] = v; else delete m[k]; }); return m; }, [musaitTaban, ogrMusaitFark]);
  const setOgrMusait = (next) => {
    const fark = {}; const esit = (a, b) => (a || []).join() === (b || []).join();
    new Set([...Object.keys(musaitTaban), ...Object.keys(next), ...Object.keys(ogrMusaitFark)]).forEach(k => { if (!esit(next[k], musaitTaban[k])) fark[k] = next[k] || []; });

  useEffect(() => { const y = Object.entries(musaitEslesme).filter(([, e]) => e.tur === "yakın"); if (y.length) console.info("[müsaitlik] yakın eşleşme:", y.map(([k, e]) => k + " → " + e.excelAd + " (" + e.sube + ")").join("; ")); }, [musaitEslesme]);
  const students = studs;
  const weekLabel = weeks[activeWeek]?.label || "";
  // @@PROGRAM-KAYIT: otomatik kayıt + geri yükleme şeridi
  const programAnahtar = programKayitAnahtari(weekLabel, studs.map(s => s.ogrenci));
  const [kayitDurum, setKayitDurum] = useState("");
  const [kayitBulundu, setKayitBulundu] = useState(null); // { anahtar, veri, kaydedildi }
  const [kayitUyari, setKayitUyari] = useState("");
  const kayitDosyaRef = useRef(null);
  const kayitBakilanRef = useRef("");
  useEffect(() => {
    if (!programAnahtar || kayitBakilanRef.current === programAnahtar) return;
    kayitBakilanRef.current = programAnahtar;
    setKayitUyari("");
    try {
      const ham = window.localStorage.getItem(programAnahtar);
      if (!ham) { setKayitBulundu(null); return; }
      const d = programKayitDogrula(JSON.parse(ham));
      if (typeof d === "string") { setKayitBulundu(null); setKayitDurum("⚠️ Kayıtlı program okunamadı: " + d); return; }
      if (!d.programOturumlar.length && !d.programGunler.length) { setKayitBulundu(null); return; }
      setKayitBulundu({ anahtar: programAnahtar, veri: d, kaydedildi: (JSON.parse(ham) || {}).kaydedildi });
    } catch (e) { setKayitBulundu(null); setKayitDurum("⚠️ Kayıtlı program okunamadı"); }
  }, [programAnahtar]);
  useEffect(() => {
    if (!programAnahtar) return;
    if (kayitBulundu && kayitBulundu.anahtar === programAnahtar) return; // şerit açıkken yazma
    if (!programGunler.length && !programOturumlar.length) return;      // boş program kayıtlıyı ezmez (sıfırla ayrı)
    const t = setTimeout(() => {
      try {
        window.localStorage.setItem(programAnahtar, JSON.stringify(programKayitPaket(weekLabel, programAnahtar, programGunler, programOturumlar)));

      } catch (e) { setKayitDurum("⚠️ Kaydedilemedi (tarayıcı depolama dolu/kapalı) — dosyaya kaydedin"); }

    return () => clearTimeout(t);
  }, [programAnahtar, programGunler, programOturumlar, kayitBulundu]);
  // Geri yükleme: veri olduğu gibi konur (motor yeniden çalıştırılmaz → elle eklenenler ve el düzenlemeleri korunur).
  const programKayitYukle = (d, kaynakMetni) => {
    setProgramGunler(d.programGunler);
    setProgramOturumlar(d.programOturumlar);

  const programKayitUyarisi = (d, gruplar) => {

  const haftaEtiketleri = weeks.map(w => w.label);

  const yeniHaftaSec = () => setWeekInput(yeniHaftaEtiketi);

  // Normalize key: trim + uppercase
  const normKey = (ders, konu) => (ders||'').trim().toLocaleUpperCase('tr-TR') + '|||' + (konu||'').trim().toLocaleUpperCase('tr-TR');

  // Inline group builder

  // Tüm konuları ders bazında tek grupta birleştir (Matematik, Fen, ...)
  const mergeAllByDers = () => {
    const byDers = {};
    students.forEach(s => (s.konular || []).forEach(k => {
      const d = (k.ders || '').trim();
      if (!d) return;
      if (!byDers[d]) byDers[d] = new Set();
      byDers[d].add(normKey(k.ders, k.konu));
    }));
    const labels = {
      'MATEMATİK': 'Matematik', 'FEN BİLİMLERİ': 'Fen', 'TÜRKÇE': 'Türkçe',
      'İNGİLİZCE': 'İngilizce', 'DİN KÜLTÜRÜ': 'Din', 'SOSYAL BİLGİLER': 'Sosyal',
      'T.C. İNKILAP TARİHİ VE ATATÜRKÇÜLÜK': 'İnkılap'
    };
    const next = {};
    Object.entries(byDers).forEach(([ders, set]) => {
      const key = 'DERS_' + ders.toUpperCase().replace(/\s+/g, '_');
      next[key] = {
        ders,
        label: labels[ders.toUpperCase()] || ders,
        konular: [...set]
      };
    });
    setKonuGruplari(next);
    setActiveTab('konuyonetici');
  };

  const buildGroupsNow = (studsArg, thr, kGruplari, aralik, tumCikti) => {
    // Build konuToGroup inline
    const k2g = {};
    Object.entries(kGruplari).forEach(([gKey, g]) => {
      g.konular.forEach(k => {
        const parts = k.split('|||');
        k2g[normKey(parts[0]||'', parts[1]||'')] = gKey;
      });
    });

    // 1) Öğrenci × grup: birleşik grubun üye konularının ortalaması.
    const acc = {}; // groupKey -> { ders, konu, altKonular, uyeler: { ad -> [yuzde,...] } }
    studsArg.forEach(s => (s.konular || []).forEach(k => {
      const rawKey = normKey(k.ders, k.konu);
      const groupKey = k2g[rawKey] || rawKey;
      const mergeInfo = kGruplari[groupKey];
      if (!acc[groupKey]) {
        const displayKonu = mergeInfo ? mergeInfo.label : k.konu;
        const displayDers = mergeInfo ? (mergeInfo.ders || k.ders) : k.ders;
        const altKonular = mergeInfo && mergeInfo.konular.length > 1
          ? mergeInfo.konular.map(rk => {
              const p = rk.split("|||");
              const found = studsArg.flatMap(s2 => s2.konular || []).find(kk =>
                normKey(kk.ders, kk.konu) === normKey(p[0] || '', p[1] || '')
              );
              return found ? found.konu : (p[1] || rk);
            }).filter(Boolean)
          : null;
        acc[groupKey] = { ders: displayDers, konu: displayKonu, altKonular, uyeler: {} };
      }
      if (!acc[groupKey].uyeler[s.ogrenci]) acc[groupKey].uyeler[s.ogrenci] = [];
      acc[groupKey].uyeler[s.ogrenci].push({ konu: k.konu, yuzde: k.yuzde, soru: soruSayisi(k), dogru: dogruSayisi(k) });
    }));

    // 2) Eşik altındaki HER gruba yerleştir (tek konuya kilitleme YOK).
    //    Öncelik sırası: öğrenci listesinde en zayıf (düşük %) önce.
    //    Birleşik grupta eşik, öğrencinin üye konularının SORU AĞIRLIKLI ortalamasına bakar (kullanıcı 15.09, `birlesikYuzde`:
    //    100·Σdoğru/Σsoru; soru yoksa eş ağırlık yedeği). Öğrencide olmayan üye konu ortalamaya girmez.
    //    `detay` birleşik grupta konu konu yüzde + soru sayısını taşır; birleşmemiş grupta yuzde = konunun kendi yüzdesi.
    //    Eşik üstü öğrenci etüt listesine GİRMEZ; yalnız `esikUstu` (yüzde artan) olarak taşınır → Program oturumunda
    //    eşik altı bitince boş kontenjanı doldurur (kullanıcı 15.09, `programAdaylari`).
    const map = {};
    const ust = {};
    const tum = {}; // @@ARALIK-MODU: grubun bütün öğrencileri (aralık grupları için)
    Object.entries(acc).forEach(([groupKey, val]) => {
      Object.entries(val.uyeler).forEach(([ad, uyeKonular]) => {
        if (!uyeKonular.length) return;
        const b = birlesikYuzde(uyeKonular);
        if (b.yuzde === null) return;
        const kayit = val.altKonular
          ? { ad, yuzde: b.yuzde, agirlik: b.agirlik, detay: birlesikDetay(uyeKonular) }
          : { ad, yuzde: b.yuzde };
        (tum[groupKey] = tum[groupKey] || { ders: val.ders, konu: val.konu, altKonular: val.altKonular, kayitlar: [] }).kayitlar.push(kayit);
        // @@GENEL-ARALIK: min>0 iken aralık altı da, üstü de gruba/sıraya girmez (aralık dışı doldurma yok)
        if (b.yuzde >= thr) { if (GENEL_ARALIK.min <= 0) (ust[groupKey] = ust[groupKey] || []).push(kayit); return; }
        if (b.yuzde < GENEL_ARALIK.min) return;
        if (!map[groupKey]) {
          map[groupKey] = {
            ders: val.ders,
            konu: val.konu,
            altKonular: val.altKonular,
            ogrenciler: []
          };
        }
        map[groupKey].ogrenciler.push(kayit);
      });
    });

    const zayifOnce = (a, b) => a.yuzde - b.yuzde || String(a.ad).localeCompare(String(b.ad), 'tr');
    Object.entries(map).forEach(([groupKey, g]) => {
      g.ogrenciler.sort(zayifOnce);
      g.esikUstu = (ust[groupKey] || []).sort(zayifOnce);
    });

    const esikGruplari = Object.entries(map)
      .map(([key,val]) => ({
        key, ...val,
        ortalama: Math.round(val.ogrenciler.reduce((a,o) => a+o.yuzde, 0) / val.ogrenciler.length)
      }))
      .sort((a,b) => a.ortalama - b.ortalama || b.ogrenciler.length - a.ogrenciler.length);
    if (tumCikti) Object.assign(tumCikti, tum);
    return aralik ? aralikGruplariUygula(esikGruplari, tum, aralik) : esikGruplari;
  };

  // konuToGroup for debug banner only
  const konuToGroup = {};
  Object.entries(konuGruplari).forEach(([gKey, g]) => {
    g.konular.forEach(k => {
      const parts = k.split('|||');
      konuToGroup[normKey(parts[0]||'', parts[1]||'')] = gKey;
    });
  });

  const grupAdaylari = {}; // @@ARALIK-MODU: konu → bütün öğrenciler (Aralık grubu ekle listesi)
  const groups = buildGroupsNow(studs, threshold, konuGruplari, aralikAyar, grupAdaylari);
  // Aralık ayarı değişince: ayar yazılır; programda oturum varsa hafta yeni gruplarla birlikte yeniden çözülür (motor aynı).
  const aralikAyarla = (yeni) => {
    const temiz = aralikAyarTemizle(yeni);
    setAralikAyar(temiz);
    if (programOturumlar.length > 0) {
      const yeniGruplar = buildGroupsNow(studs, threshold, konuGruplari, temiz);
      const gecerli = new Set(yeniGruplar.map(g => g.key));
      setProgramOturumlar(programElleKoruyarak(yeniGruplar, programGunler,

  const buildStudentWeakTopics = (student, thr, kGruplari) => {

    Object.entries(kGruplari || {}).forEach(([gKey, g]) => {

    const acc = {};
    (student.konular || []).forEach(k => {
      const rawKey = normKey(k.ders, k.konu);
      const groupKey = k2g[rawKey] || rawKey;
      const mergeInfo = (kGruplari || {})[groupKey];
      if (!acc[groupKey]) {
        acc[groupKey] = {
          groupKey,
          ders: mergeInfo ? (mergeInfo.ders || k.ders) : k.ders,
          konu: mergeInfo ? mergeInfo.label : k.konu,
          altKonular: mergeInfo && mergeInfo.konular.length > 1

            : null,
          uyeler: []

    });

    return Object.values(acc)

      Object.entries(result).forEach(([gk,g]) => { if(g.konular.length>0) final[gk]=g; });
      return final;
    });

              const t = genelTaslak || genelAralik;
              const hata = genelTaslak ? aralikDogrula(t.min, t.max) : null;
              const uygulaG = () => { if (!genelTaslak) return; if (aralikDogrula(genelTaslak.min, genelTaslak.max) !== null) return; setGenelAralik({min:Number(genelTaslak.min), max:Number(genelTaslak.max)}); setGenelTaslak(null); };

              return (<>
                <span style={{fontSize:11,color:"#64748b",whiteSpace:"nowrap"}}>Aralık %</span>
